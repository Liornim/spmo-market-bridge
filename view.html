<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>נרות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F4F7; --ink:#1B2430; --muted:#5B6673; --rule:#D6DBE2; --well:#FFFFFF;
    --up:#0F766E; --up-soft:#D7EFEC; --down:#B42318; --down-soft:#F6DAD6; --flat:#8A94A0;
    --fresh:#0F766E; --aging:#B45309; --stale:#B42318;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
  body{padding:0 0 env(safe-area-inset-bottom)}
  .top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
  select{font:inherit;font-weight:600;font-size:16px;background:var(--well);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;appearance:none;-webkit-appearance:none;min-width:0}
  #sym{font-weight:800;font-size:20px;letter-spacing:.02em}
  .spacer{flex:1}
  .fresh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
  .fresh i{width:9px;height:9px;border-radius:50%;background:var(--flat);flex:none}
  .fresh.fresh-ok i{background:var(--fresh)} .fresh.fresh-aging i{background:var(--aging)} .fresh.fresh-stale i{background:var(--stale)}

  .hero{padding:4px 16px 0}
  .px{display:flex;align-items:baseline;gap:12px;direction:ltr;justify-content:flex-end}
  .px b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .px span{font-size:17px;font-weight:600}
  .px .up{color:var(--up)} .px .down{color:var(--down)}
  .px small{font-size:13px;color:var(--muted);font-weight:400}
  .stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink);font-weight:600;direction:ltr;unicode-bidi:isolate}

  .chart{margin:12px 0 0;background:var(--well);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  svg{display:block;width:100%;height:auto;touch-action:pan-y}
  .wick{stroke-width:1} .body{stroke:none}
  .up-c{fill:var(--up);stroke:var(--up)} .down-c{fill:var(--down);stroke:var(--down)} .flat-c{fill:var(--flat);stroke:var(--flat)}
  .grid{stroke:var(--rule);stroke-width:1} .gridtxt{fill:var(--muted);font-size:11px;font-family:inherit}
  .vol{opacity:.55}
  .cursor{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  .pick{fill:var(--ink);font-size:12px;font-weight:600}
  .pickbg{fill:var(--well);stroke:var(--rule)}

  table{width:100%;border-collapse:collapse;direction:ltr;font-size:13.5px;margin-top:8px}
  th{position:sticky;top:0;background:var(--paper);color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--rule);font-size:12px}
  td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:16px;font-weight:600}
  th:last-child,td:last-child{padding-right:16px}
  tr.up td.c{color:var(--up)} tr.down td.c{color:var(--down)}
  tr.hot{background:var(--up-soft)} tr.hot.down{background:var(--down-soft)}
  tr.last td{font-weight:600}
  .mini{display:inline-block;width:10px;height:22px;position:relative;vertical-align:middle}
  .mini i{position:absolute;left:4.5px;width:1px;background:currentColor;top:0;bottom:0}
  .mini b{position:absolute;left:1px;right:1px;background:currentColor;border-radius:1px}
  .mini.up{color:var(--up)} .mini.down{color:var(--down)} .mini.flat{color:var(--flat)}
  td.x{color:var(--muted)} td.x.hi{color:var(--ink);font-weight:600}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 20px;font-size:13px;color:var(--muted)}
  button{font:inherit;font-size:13px;background:var(--well);border:1px solid var(--rule);color:var(--ink);border-radius:10px;padding:7px 12px}
  button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .msg{padding:40px 16px;text-align:center;color:var(--muted);line-height:1.6}
  .msg b{color:var(--ink)}
  @media (prefers-reduced-motion:no-preference){ .px b{transition:color .3s} }
</style>
</head>
<body>
<div class="top">
  <select id="sym" aria-label="סימבול"></select>
  <select id="date" aria-label="תאריך"></select>
  <div class="spacer"></div>
  <div class="fresh" id="fresh"><i></i><span>טוען</span></div>
</div>
<div class="hero">
  <div class="px"><b id="last">—</b><span id="chg"></span><small>מהפתיחה</small></div>
  <div class="stats" id="stats"></div>
</div>
<div class="chart"><svg id="svg" viewBox="0 0 400 300" preserveAspectRatio="none"></svg></div>
<div id="tbl"></div>
<div class="foot">
  <span id="refresh"></span>
  <span><button id="order">ישן למעלה</button> <button id="pause">השהה רענון</button></span>
</div>

<script>
(function(){
  var qs=function(s){return document.querySelector(s)};
  var parts=location.pathname.split('/').filter(Boolean);            // view, SYM, DATE
  var SYM=(parts[1]||'').toUpperCase(), DATE=parts[2]||'';
  var rows=[], newestFirst=true, paused=false, timer=null, left=60, picked=-1;
  var symSel=qs('#sym'), dateSel=qs('#date');

  function fmtK(v){return v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?Math.round(v/1e3)+'K':String(v)}
  function ago(s){if(s==null)return '';if(s<60)return 'לפני '+s+' שנ׳';var m=Math.floor(s/60);if(m<60)return 'לפני '+m+' דק׳';return 'לפני '+Math.floor(m/60)+' שע׳'}
  function bust(u){return u+(u.indexOf('?')>0?'&':'?')+'ts='+Date.now()}
  function j(u){return fetch(bust(u),{cache:'no-store'}).then(function(r){return r.json()})}
  function derive(r){
    var range=r.high-r.low, body=Math.abs(r.close-r.open);
    var pct=function(x){return range>0?Math.round(x/range*1000)/10:0};
    r.dir=r.close>r.open?'up':r.close<r.open?'down':'flat';
    r.body=pct(body); r.uw=pct(r.high-Math.max(r.open,r.close)); r.lw=pct(Math.min(r.open,r.close)-r.low); r.range=range;
    return r;
  }

  function loadSymbols(){
    return j('/').then(function(h){
      var list=h.tracked||[]; if(SYM&&list.indexOf(SYM)<0)list.unshift(SYM); if(!SYM)SYM=list[0]||'NVDA';
      symSel.innerHTML=list.map(function(s){return '<option'+(s===SYM?' selected':'')+'>'+s+'</option>'}).join('');
    });
  }
  function loadDates(){
    return j('/days/'+SYM).then(function(d){
      var ds=(d.days||[]).map(function(x){return x.date});
      if(DATE&&ds.indexOf(DATE)<0)ds.unshift(DATE);
      if(!DATE)DATE=ds[0]||'';
      dateSel.innerHTML=ds.map(function(x){return '<option value="'+x+'"'+(x===DATE?' selected':'')+'>'+x.slice(5).replace('-','/')+'</option>'}).join('');
    });
  }
  function load(){
    var u='/day/'+SYM+(DATE?'/'+DATE:'')+'?format=json';
    return j(u).then(function(d){
      rows=(d.rows||[]).map(derive); DATE=d.date||DATE;
      if(dateSel.value!==DATE&&DATE){ if(![].some.call(dateSel.options,function(o){return o.value===DATE})){var o=document.createElement('option');o.value=DATE;o.textContent=DATE.slice(5).replace('-','/');dateSel.insertBefore(o,dateSel.firstChild)} dateSel.value=DATE }
      render(d.stale_seconds);
      history.replaceState(null,'','/view/'+SYM+'/'+DATE);
    });
  }

  function render(stale){
    var f=qs('#fresh'); var span=f.querySelector('span');
    if(!rows.length){f.className='fresh';span.textContent='אין נתונים';qs('#tbl').innerHTML='<div class="msg"><b>אין נרות ל-'+SYM+'</b><br>ל-'+(DATE||'היום')+' עדיין לא נשמר כלום.</div>';qs('#svg').innerHTML='';qs('#last').textContent='—';qs('#chg').textContent='';qs('#stats').innerHTML='';return}
    var last=rows[rows.length-1], first=rows[0];
    var closedSession=last.time>='15:59';
    f.className='fresh '+(closedSession?'fresh-ok':stale<=180?'fresh-ok':stale<=600?'fresh-aging':'fresh-stale');
    span.textContent=closedSession?'סשן הסתיים':'נר אחרון '+ago(stale);

    var chg=(last.close-first.open)/first.open*100;
    qs('#last').textContent=last.close.toFixed(2);
    var c=qs('#chg'); c.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%'; c.className=chg>=0?'up':'down';
    var hi=Math.max.apply(null,rows.map(function(r){return r.high})), lo=Math.min.apply(null,rows.map(function(r){return r.low}));
    var ups=rows.filter(function(r){return r.dir==='up'}).length, downs=rows.filter(function(r){return r.dir==='down'}).length;
    var vol=rows.reduce(function(a,r){return a+r.volume},0);
    var hiBar=rows.reduce(function(a,r){return r.high>a.high?r:a},rows[0]), loBar=rows.reduce(function(a,r){return r.low<a.low?r:a},rows[0]);
    qs('#stats').innerHTML=
      '<span>גבוה <b>'+hi.toFixed(2)+'</b> ב-<b>'+hiBar.time+'</b></span>'+
      '<span>נמוך <b>'+lo.toFixed(2)+'</b> ב-<b>'+loBar.time+'</b></span>'+
      '<span>נרות <b>'+rows.length+'</b></span>'+
      '<span>עולים <b>'+ups+'</b> יורדים <b>'+downs+'</b></span>'+
      '<span>נפח <b>'+fmtK(vol)+'</b></span>';
    drawChart();
    drawTable();
  }

  function drawChart(){
    var svg=qs('#svg'); var W=Math.max(320,svg.clientWidth||360), H=300, PH=210, VH=60, top=14, gap=10;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    var n=rows.length, padL=8, padR=52, cw=(W-padL-padR)/Math.max(n,60), bw=Math.max(1.5,Math.min(6,cw*0.65));
    var hi=Math.max.apply(null,rows.map(function(r){return r.high})), lo=Math.min.apply(null,rows.map(function(r){return r.low}));
    var span=(hi-lo)||1; hi+=span*0.04; lo-=span*0.04; span=hi-lo;
    var y=function(p){return top+(hi-p)/span*PH};
    var vmax=Math.max.apply(null,rows.map(function(r){return r.volume}))||1;
    var out=[];
    // horizontal grid: 4 levels
    for(var g=0;g<=4;g++){var p=lo+span*g/4, yy=y(p); out.push('<line class="grid" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/><text class="gridtxt" x="'+(W-padR+6)+'" y="'+(yy+4).toFixed(1)+'">'+p.toFixed(2)+'</text>')}
    // hour ticks
    rows.forEach(function(r,i){ if(r.time.slice(3)==='00'||r.time==='09:30'){var x=padL+i*cw+cw/2; out.push('<line class="grid" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+top+'" y2="'+(top+PH+gap+VH)+'"/><text class="gridtxt" x="'+(x+3).toFixed(1)+'" y="'+(H-2)+'">'+r.time+'</text>')}});
    // candles + volume
    rows.forEach(function(r,i){
      var x=padL+i*cw+cw/2, cls=r.dir+'-c';
      out.push('<line class="wick '+cls+'" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+y(r.high).toFixed(1)+'" y2="'+y(r.low).toFixed(1)+'"/>');
      var yo=y(r.open), yc=y(r.close), bt=Math.min(yo,yc), bh=Math.max(1,Math.abs(yo-yc));
      out.push('<rect class="body '+cls+'" x="'+(x-bw/2).toFixed(1)+'" y="'+bt.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" data-i="'+i+'"/>');
      var vh=r.volume/vmax*VH;
      out.push('<rect class="vol '+cls+'" x="'+(x-bw/2).toFixed(1)+'" y="'+(top+PH+gap+VH-vh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+vh.toFixed(1)+'"/>');
    });
    // last close marker
    var lr=rows[rows.length-1], ly=y(lr.close);
    out.push('<line class="cursor" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+ly.toFixed(1)+'" y2="'+ly.toFixed(1)+'"/>');
    out.push('<rect class="pickbg" x="'+(W-padR+2)+'" y="'+(ly-9).toFixed(1)+'" width="'+(padR-4)+'" height="18" rx="4"/><text class="pick" x="'+(W-padR+6)+'" y="'+(ly+4).toFixed(1)+'">'+lr.close.toFixed(2)+'</text>');
    // picked bar readout
    if(picked>=0&&picked<n){var pr=rows[picked], px=padL+picked*cw+cw/2;
      out.push('<line class="cursor" x1="'+px.toFixed(1)+'" x2="'+px.toFixed(1)+'" y1="'+top+'" y2="'+(top+PH)+'"/>');
      var label=pr.time+'  O '+pr.open.toFixed(2)+'  H '+pr.high.toFixed(2)+'  L '+pr.low.toFixed(2)+'  C '+pr.close.toFixed(2)+'  V '+fmtK(pr.volume);
      var lw=label.length*6.4+12, lx=Math.min(Math.max(padL,px-lw/2),W-padR-lw);
      out.push('<rect class="pickbg" x="'+lx.toFixed(1)+'" y="2" width="'+lw.toFixed(1)+'" height="16" rx="4"/><text class="pick" x="'+(lx+6).toFixed(1)+'" y="13" style="font-size:11px">'+label+'</text>');
    }
    svg.innerHTML=out.join('');
    svg.onclick=function(e){var pt=svg.getBoundingClientRect(); var xr=(e.clientX-pt.left)/pt.width*W; var i=Math.floor((xr-padL)/cw); if(i>=0&&i<n){picked=i;drawChart();var tr=document.getElementById('r'+i);if(tr){tr.scrollIntoView({block:'center',behavior:'smooth'})}}};
  }

  function drawTable(){
    var avg=rows.reduce(function(a,r){return a+r.volume},0)/rows.length;
    var order=newestFirst?rows.slice().reverse():rows;
    var h='<table><thead><tr><th>שעה</th><th>פתיחה</th><th>גבוה</th><th>נמוך</th><th>סגירה</th><th>נפח</th><th>×</th><th>גוף</th><th></th></tr></thead><tbody>';
    order.forEach(function(r){
      var i=rows.indexOf(r), x=avg>0?r.volume/avg:0;
      var cls=r.dir+(i===rows.length-1?' last':'')+(x>=2?' hot':'')+(i===picked?' picked':'');
      // mini candle: body placed by open/close within the bar's own range
      var top=r.range>0?(r.high-Math.max(r.open,r.close))/r.range*100:0, bh=r.range>0?Math.max(4,r.body):50;
      h+='<tr id="r'+i+'" class="'+cls+'"><td>'+r.time+'</td><td>'+r.open.toFixed(2)+'</td><td>'+r.high.toFixed(2)+'</td><td>'+r.low.toFixed(2)+'</td><td class="c">'+r.close.toFixed(2)+'</td><td>'+fmtK(r.volume)+'</td><td class="x'+(x>=2?' hi':'')+'">'+x.toFixed(1)+'</td><td>'+r.body+'%</td><td><span class="mini '+r.dir+'"><i></i><b style="top:'+top.toFixed(0)+'%;height:'+bh.toFixed(0)+'%"></b></span></td></tr>';
    });
    qs('#tbl').innerHTML=h+'</tbody></table>';
    qs('#tbl').onclick=function(e){var tr=e.target.closest('tr[id]');if(tr){picked=+tr.id.slice(1);drawChart();drawTable()}};
  }

  // refresh: only while the session may still be running
  function tick(){
    var live=rows.length&&rows[rows.length-1].time<'15:59'&&DATE===todayET();
    var el=qs('#refresh');
    if(!live){el.textContent='';return}
    if(paused){el.textContent='רענון מושהה';return}
    left--; el.textContent='רענון בעוד '+left+' שנ׳';
    if(left<=0){left=60;load().catch(function(){})}
  }
  function todayET(){var p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce(function(a,x){a[x.type]=x.value;return a},{});return p.year+'-'+p.month+'-'+p.day}

  symSel.onchange=function(){SYM=symSel.value;DATE='';picked=-1;loadDates().then(load)};
  dateSel.onchange=function(){DATE=dateSel.value;picked=-1;load()};
  qs('#order').onclick=function(){newestFirst=!newestFirst;this.textContent=newestFirst?'ישן למעלה':'חדש למעלה';drawTable()};
  qs('#pause').onclick=function(){paused=!paused;this.textContent=paused?'המשך רענון':'השהה רענון';tick()};
  window.addEventListener('resize',function(){if(rows.length)drawChart()});

  loadSymbols().then(loadDates).then(load).catch(function(e){qs('#tbl').innerHTML='<div class="msg"><b>לא הצלחתי לטעון.</b><br>'+String(e)+'</div>'});
  timer=setInterval(tick,1000);
})();
</script>
</body>
</html>
