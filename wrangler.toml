# bars-vault — Cloudflare Worker configuration
# Everything the dashboard would otherwise hold: bindings, cron, name.
# Cloudflare Workers Builds reads this file on every push.

name = "spmo-market-bridge"
main = "worker.js"
compatibility_date = "2026-08-01"

# Intraday pull every 5 min during the US session (both DST cases).
#
# The maintenance window runs 00:00-01:55 UTC, i.e. AFTER the daily quota
# resets, on Tue-Sat so it lands on the evening of each Mon-Fri session. It
# used to sit at 22-23 UTC — before the reset — which meant that on any day the
# budget was spent, the window opened on the SAME exhausted budget, the job
# stood down, and the index build, archive pass and backfill never happened.
# That is why a frozen day silently cost the following night's work too.
[triggers]
crons = ["*/5 13-21 * * 1-5", "*/5 0-1 * * 2-6"]

[[d1_databases]]
binding = "DB"
database_name = "bars-vault"
database_id = "a70c0956-18f2-4ed4-8975-023e5214a00d"

workers_dev = true
preview_urls = false

# The system log lives in KV, NOT in D1: a log inside the database it reports on
# goes dark exactly when the database is the problem.
#
# This MUST stay here rather than being bound by hand in the dashboard. A
# deploy from GitHub rewrites the Worker's bindings from this file, so a
# hand-added binding is silently dropped on the next push — which is how the
# log went dark three times, each time leaving us diagnosing blind.
[[kv_namespaces]]
binding = "LOG"
id = "49f201f3047342e2804dd643f676984b"

[observability]
enabled = true
