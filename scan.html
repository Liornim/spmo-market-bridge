<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סריקה · 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F2F4F7;--ink:#1B2430;--muted:#5B6673;--rule:#D6DBE2;--well:#FFFFFF;
    --up:#0F766E;--down:#B42318;--flat:#8A94A0;
    --s-quiet:#8A94A0;--s-watch:#B7791F;--s-close:#C2410C;--s-ready:#0F766E;--s-active:#1D4ED8;--s-avoid:#B42318;--s-none:#98A2B3}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-variant-numeric:tabular-nums}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .num{direction:ltr;unicode-bidi:isolate}
  button,select{font:inherit}
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
  .hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
  h1{margin:0;font-size:19px;font-weight:800}
  .spacer{flex:1}
  .build{font-size:10px;color:var(--muted);direction:ltr;unicode-bidi:isolate;opacity:.8}
  .mini-btn{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink);text-decoration:none}
  .note{padding:0 16px 8px;font-size:12px;color:var(--muted);line-height:1.5}
  .note b{color:var(--ink)}
  .ctrl{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .ctrl select{max-width:46vw}
  .counts{-webkit-overflow-scrolling:touch}
  .ctrl select{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 9px;font-size:13px;color:var(--ink)}
  .counts{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .cnt{border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;border:none}
  .cnt[data-on="0"]{opacity:.35} .cnt.sel{outline:2px solid var(--ink);outline-offset:1px}
  .bg-QUIET{background:var(--s-quiet)} .bg-WATCH{background:var(--s-watch)} .bg-CLOSE{background:var(--s-close)}
  .bg-READY{background:var(--s-ready)} .bg-ACTIVE{background:var(--s-active)} .bg-AVOID{background:var(--s-avoid)} .bg-NODATA{background:var(--s-none)}
  .rows{padding:6px 10px 0}
  /* Three columns with a hard minimum-width of zero on the middle one. Without
     min-width:0 a grid track refuses to shrink below its content, so the long
     reason text pushed the score and the buttons out of the card. */
  .row{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:6px 10px;background:var(--well);
    border:1px solid var(--rule);border-left:4px solid var(--s-none);border-radius:12px;
    padding:10px 12px;margin-bottom:7px;align-items:start;overflow:hidden}
  .row>*{min-width:0}
  .row .sym{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis}
  .row .px{font-size:12.5px;color:var(--muted);font-weight:600;direction:ltr;unicode-bidi:isolate}
  .row .st{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px}
  /* The reason wraps to two lines instead of being cut mid-word: it is the
     whole point of the row, and an ellipsis hid the second half of every one. */
  .row .why{font-size:12.5px;margin:0 0 3px;line-height:1.45;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .row .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:4px 9px;flex-wrap:wrap;align-items:baseline}
  .row .meta b{color:var(--ink);font-weight:600}
  .row .score{font-size:20px;font-weight:800;line-height:1;text-align:center}
  .row .score small{font-size:9.5px;color:var(--muted);font-weight:600}
  .QUIET{border-left-color:var(--s-quiet)} .WATCH{border-left-color:var(--s-watch)} .CLOSE{border-left-color:var(--s-close)}
  .READY{border-left-color:var(--s-ready)} .ACTIVE{border-left-color:var(--s-active)} .AVOID{border-left-color:var(--s-avoid)}
  .row.stale{opacity:.7}
  /* The right-hand column is a stack, not a line: score, then state, then the
     two actions, each full width so nothing spills sideways. */
  .row .rt{display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .track{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:4px 2px;
    font-size:11px;font-weight:600;width:100%;white-space:nowrap}
  .track:disabled{opacity:.5}
  .live{display:block;text-align:center;font-size:11px;font-weight:700;color:var(--up)}
  .hist{margin:0;background:var(--well);border:1px solid var(--rule);border-radius:8px;padding:4px 2px;
    font-size:10.5px;color:var(--muted);width:100%;white-space:nowrap}
  .empty{padding:22px 16px;text-align:center;color:var(--muted);line-height:1.6}
  .prog{font-size:12px;color:var(--muted)}
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(20,26,34,.45);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .hpanel{background:var(--paper);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .hhead{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper)}
  .hhead b{font-size:19px;font-weight:800}
  .hsum{font-size:12.5px;color:var(--muted)}
  .hhead button{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 11px;font-size:13px}
  .hdays{padding:6px 16px 0}
  .hd{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
  .hd b{font-weight:700;color:var(--muted);font-size:12.5px}
  .hcopy,.hdl{background:var(--well);border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink);text-decoration:none}
  .hall{display:flex;gap:8px;padding:14px 16px}
  .hall button{background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600}
  .sugg{margin:8px 10px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;overflow:hidden}
  .sugg[hidden]{display:none}
  .sh{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 0 6px;letter-spacing:.02em}
  .sg{border-top:1px solid var(--rule);padding:8px 0}
  .sg:first-of-type{border-top:none}
  .sgtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sgtop b{font-size:15px;font-weight:800}
  .sgs{font-size:12.5px;color:var(--muted);font-weight:700}
  .sgw{font-size:12.5px;color:var(--ink);margin-top:2px;line-height:1.5}
  .sgsw{font-size:12px;color:var(--s-close);margin-top:3px}
  .sgnone{font-size:12.5px;color:var(--muted);padding:4px 0}
  .sgnote{font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:7px;border-top:1px solid var(--rule)}
  .sg .track{margin-top:7px;width:auto;padding:6px 14px;font-size:12px}
  .dir{font-weight:700} .dir.up{color:var(--up)} .dir.dn{color:var(--down)}
  .lvls2{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .dir{white-space:nowrap}
  .cap{font-size:11.5px;color:var(--s-close);margin-top:3px}
  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60}
  .toast[hidden]{display:none}
  @media(min-width:720px){
    .rows,.sugg{max-width:900px;margin-left:auto;margin-right:auto}
    .row{grid-template-columns:90px minmax(0,1fr) 96px}
    .row .why{-webkit-line-clamp:1}
    .track,.hist{font-size:12px;padding:5px 6px}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>סריקה · 100</h1>
    <div class="spacer"></div>
    <a class="mini-btn" href="/radar">מעקב · 20</a>
    <button class="mini-btn" id="reload" type="button">רענן</button>
    <span class="build" title="גרסת העמוד">v<!--BUILD--></span>
  </div>
  <div class="note">כל המניות בארכיון. הנתונים מפגרים עד שעה אחרי השוק, לכן <b>זו סריקה לזיהוי מועמדים, לא מסך מסחר</b>. מי שמעניין — עוברים אליו במעקב.</div>
  <div class="ctrl">
    <span>מיון</span>
    <select id="sort">
      <option value="score" selected>ציון מועמדות</option>
      <option value="direction">מתחזקים</option>
      <option value="range">טווח יומי</option>
      <option value="volume">מחזור</option>
      <option value="symbol">סימבול</option>
    </select>
    <select id="date" aria-label="תאריך"></select>
    <div class="spacer"></div>
    <button class="mini-btn" id="fill" type="button" hidden></button>
    <span class="prog" id="prog"></span>
  </div>
  <div class="note" id="when"></div>
  <div class="note" id="fillmsg" hidden style="color:var(--s-close)"></div>
  <div class="counts" id="counts"></div>
</header>
<div class="sugg" id="sugg" hidden></div>
<div class="rows" id="rows"><div class="empty">טוען…</div></div>
<div class="sheet" id="sheet" hidden><div class="hpanel" id="hpanel"></div></div>
<div class="toast" id="toast" hidden></div>

<!--ENGINE-->
<script>
(function(){
  var qs=function(s){return document.querySelector(s)};
  // No setup vocabulary lives on this page. The bands describe CANDIDACY, and
  // the CSS class names are reused only for their colours.
  var MOM_TXT={PUSHING:'דוחף',PULLBACK:'נסיגה',RECOVERY:'התאוששות',SELLING:'מכירות',FLAT:'שטוח'};
  var STRUCT_TXT={UP:'עולה',DOWN:'יורד',RANGE:'טווח'};
  // A scan describes where a symbol IS. It never says what to do — even when
  // the archive happens to be fresh — because that is the live radar's job and
  // the two must not be confusable.
  var OBSERVE={NO_SETUP:'אין setup',WAITING_FOR_ZONE:'מתקרב לאזור',IN_ZONE:'בתוך האזור',
    READY_PARTIAL:'האזור מוחזק',WAITING_FOR_CONFIRMATION:'מעל רמת האישור',READY_ADD:'אישור התקבל',
    ACTIVE:'מהלך פעיל',TAKE_PROFIT_AREA:'באזור היעד',DO_NOT_CHASE:'התרחק מהכניסה',FAILED:'setup נכשל'};
  function observe(r){
    var P=r.plan; if(!P)return r.why||'';
    var base=OBSERVE[P.state]||P.state;
    var z=P.zone?P.zone.map(function(x){return x.toFixed(2)}).join('–'):null;
    if(P.state==='WAITING_FOR_ZONE'||P.state==='IN_ZONE'||P.state==='READY_PARTIAL')return base+(z?' '+z:'');
    if(P.state==='WAITING_FOR_CONFIRMATION'||P.state==='READY_ADD')return base+(P.addAbove!=null?' '+P.addAbove.toFixed(2):'');
    if(P.state==='TAKE_PROFIT_AREA'||P.state==='ACTIVE')return base+(P.target!=null?' '+P.target.toFixed(2):'');
    return base;
  }
  var store={}, symbols=[], filterStatus=null, loading=false, viewDate=null, shownDate=null, dates=[], loadedDays={};

  function bust(u){return u+(u.indexOf('?')>0?'&':'?')+'ts='+Date.now()}
  // 429 and 5xx are transient: a rate cap that resets in a minute, or a
  // deploy swapping over. Retrying beats showing the trader a dead screen.
  function j(u,tries){
    var left=tries==null?2:tries;
    return fetch(bust(u),{cache:'no-store'}).then(function(r){
      if(r.status===404)return r.json();
      if(!r.ok){
        if((r.status===429||r.status>=500)&&left>0)
          return new Promise(function(res){setTimeout(res,r.status===429?4000:1500)}).then(function(){return j(u,left-1)});
        throw new Error(r.status);
      }
      return r.json();
    });
  }
  function toast(t){var el=qs('#toast');el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(function(){el.hidden=true},1800)}

  // The trading date that should have data now (same rule as the radar).
  function expectedSessionDate(){
    var p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',
      day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date())
      .reduce(function(a,x){a[x.type]=x.value;return a},{});
    var d=new Date(p.year+'-'+p.month+'-'+p.day+'T12:00:00Z');
    if((p.hour+':'+p.minute)<'09:30')d.setUTCDate(d.getUTCDate()-1);
    while(d.getUTCDay()===0||d.getUTCDay()===6)d.setUTCDate(d.getUTCDate()-1);
    return d.toISOString().slice(0,10);
  }
  function freshness(rows,date){
    if(!rows||!rows.length)return 'NO DATA';
    var last=rows[rows.length-1];
    if(date<expectedSessionDate())return 'STALE';
    if(last.time>='15:59')return 'SESSION ENDED';
    var age=Math.floor(Date.now()/1000)-(last.unix||0);
    return age<=180?'LIVE':age<=600?'DELAYED':'STALE';
  }

  // One call for the board, then the remainder the server could not reach in
  // batches of 40, until nothing is left.
  function loadUniverse(date){
    var q='/board?universe=1&date='+date;
    return j(q).then(function(d){
      var rest=(d.not_fetched||[]).slice(), total=(d.symbols||[]).length, got=total-rest.length;
      qs('#prog').textContent=got+'/'+total;
      // A follow-up call has the SAME subrequest ceiling as the first, so it
      // also defers what it could not reach. Ignoring that left most of the
      // universe unfetched while the page reported it as missing.
      var guard=0;
      var next=function(){
        if(!rest.length||guard++>30)return Promise.resolve(d);
        var batch=rest.splice(0,40);
        return j('/board?date='+date+'&symbols='+batch.join(',')).then(function(more){
          (more.rows||[]).forEach(function(r){d.rows.push(r)});
          // whatever this call deferred goes back on the queue
          var again=(more.not_fetched||[]).filter(function(s){return batch.indexOf(s)>=0});
          again.forEach(function(s){rest.push(s)});
          got+=(batch.length-again.length);
          qs('#prog').textContent=got+'/'+total;
          return next();
        },function(){ return next(); });
      };
      return next();
    });
  }

  // The latest session the archive actually holds. Before the open, that is
  // yesterday — asking for today and printing "no data" beside a symbol with
  // five days of history was the wrong answer to the wrong question.
  function latestArchivedDate(){
    return j('/archive/dates').then(function(d){
      dates=(d.dates||[]);
      return dates.length?dates[0]:expectedSessionDate();
    },function(){ return expectedSessionDate(); });
  }
  // The candidate score needs several closed sessions, not one. The board gives
  // the day on screen; the rest come from the archive, once, in one call per
  // day rather than one per symbol.
  function loadPriorDays(date){
    var want=dates.filter(function(d){return d<date}).slice(0,4);
    var need=want.filter(function(d){return !loadedDays[d]});
    if(!need.length)return Promise.resolve();
    return need.reduce(function(p,d){
      return p.then(function(){
        return j('/board?universe=1&date='+d).then(function(bd){
          (bd.rows||[]).forEach(function(r){
            var st=store[r.symbol]||(store[r.symbol]={rows:[],days:{}});
            st.days=st.days||{}; (st.days[d]=st.days[d]||[]).push(r);
          });
          loadedDays[d]=1;
        },function(){});
      });
    },Promise.resolve());
  }
  function loadAll(){
    if(loading)return Promise.resolve();
    loading=true;
    qs('#prog').textContent='טוען…';
    var pick=viewDate?Promise.resolve(viewDate):latestArchivedDate();
    return pick.then(function(date){
      shownDate=date;
      return loadUniverse(date);
    }).then(function(d){
      // Clear BEFORE loading the prior days, not after: resetting the store
      // afterwards threw away every session the multi-day score depends on,
      // which is why no levels ever reached the screen.
      symbols=(d.symbols||[]).slice();
      store={}; loadedDays={};
      (d.rows||[]).forEach(function(r){
        var st=store[r.symbol]||(store[r.symbol]={rows:[],days:{}});
        st.rows.push(r);
      });
      return loadPriorDays(shownDate).then(function(){return d});
    }).then(function(d){
      var date=shownDate;
      // The scanner asks ONE question: is this worth attention today? It does
      // not run the execution engine, because a setup state derived from a
      // closed session is not a state — it is yesterday's decision, and
      // carrying it forward is exactly what we forbade.
      symbols.forEach(function(s){
        var st=store[s]||(store[s]={rows:[]});
        st.rows.sort(function(a,b){return a.unix-b.unix});
        st.days=st.days||{};
        if(st.rows.length)st.days[date]=st.rows;
        var sessions=Object.keys(st.days).sort().map(function(d){return st.days[d]});
        st.cand=sessions.length?candidateScore(sessions):{score:null,reasons:[],levels:[]};
        st.trend=sessions.length>=3?candidateTrend(sessions):{direction:'unknown',delta:null,text:'נדרשים עוד ימים להשוואה'};
      });
      loading=false;
      var withData=symbols.filter(function(s){return store[s].rows.length}).length;
      var exp=expectedSessionDate();
      qs('#prog').textContent=withData+' עם נתונים';
      var gap=symbols.length-withData, fb=qs('#fill');
      fb.hidden=gap===0; fb.disabled=false;
      if(gap)fb.textContent='מלא '+gap+' חסרות';
      // Say plainly which session is on screen, and whether it is the current one.
      qs('#when').innerHTML=date===exp
        ?'נתונים מהסשן הנוכחי · '+date.slice(5).replace('-','/')
        :'<b>נתונים מ-'+date.slice(5).replace('-','/')+'</b> — הסשן האחרון שיש בארכיון';
      drawDates();
      render();
    },function(e){loading=false;qs('#rows').innerHTML='<div class="empty"><b>שגיאת טעינה</b><br>'+String(e)+'</div>'});
  }

  function render(){
    var rows=symbols.map(function(s){return {symbol:s}});
    var bandOf=function(s){var c=(store[s]||{}).cand||{};
      return c.score==null?'NODATA':c.score>=65?'READY':c.score>=50?'CLOSE':c.score>=35?'WATCH':'QUIET'};
    var BAND_TXT={READY:'מועמד חזק',CLOSE:'מועמד',WATCH:'שולי',QUIET:'לא מעניין',NODATA:'אין נתונים'};
    ['READY','CLOSE','WATCH','QUIET','NODATA'].forEach(function(){});
    qs('#counts').innerHTML=['READY','CLOSE','WATCH','QUIET','NODATA'].map(function(k){
      var n=rows.filter(function(r){return bandOf(r.symbol)===k}).length;
      return '<button type="button" class="cnt bg-'+k+(filterStatus===k?' sel':'')+'" data-k="'+k+'" data-on="'+n+'">'+BAND_TXT[k]+' '+n+'</button>';
    }).join('');
    [].forEach.call(document.querySelectorAll('.cnt'),function(b){b.onclick=function(){filterStatus=filterStatus===b.dataset.k?null:b.dataset.k;render()}});
    var mode=qs('#sort').value;
    var list=rows.slice().sort(function(a,b){
      var ca=(store[a.symbol]||{}).cand||{}, cb=(store[b.symbol]||{}).cand||{};
      var ta=(store[a.symbol]||{}).trend||{}, tb=(store[b.symbol]||{}).trend||{};
      if(mode==='symbol')return a.symbol<b.symbol?-1:1;
      if(mode==='direction')return (tb.delta||0)-(ta.delta||0)||((cb.score||0)-(ca.score||0));
      if(mode==='range')return (cb.atrPct||0)-(ca.atrPct||0);
      if(mode==='volume')return (cb.relVol||0)-(ca.relVol||0);
      return (cb.score==null?-1:cb.score)-(ca.score==null?-1:ca.score);
    });
    if(filterStatus)list=list.filter(function(r){return bandOf(r.symbol)===filterStatus});
    drawSuggestions();
    if(!list.length){qs('#rows').innerHTML='<div class="empty">אין מניות להצגה.</div>';return}
    qs('#rows').innerHTML=list.map(function(r){
      var st=store[r.symbol]||{}, c=st.cand||{}, tr=st.trend||{};
      if(c.score==null) return '<div class="row NODATA stale"><div><div class="sym">'+r.symbol+'</div><div class="px">—</div></div>'+
        '<div><span class="st bg-NODATA">אין נתונים</span><div class="why">עדיין לא בארכיון</div></div>'+
        '<div class="rt"><div class="score">—</div>'+
        (live[r.symbol]?'<span class="live">חי</span>':'<button type="button" class="track" data-s="'+r.symbol+'">למעקב</button>')+
        '<button type="button" class="hist" data-s="'+r.symbol+'">היסטוריה</button></div></div>';
      var band=c.score>=65?'READY':c.score>=50?'CLOSE':c.score>=35?'WATCH':'QUIET';
      var arrow=tr.direction==='improving'?'<span class="dir up">▲ מתחזק</span>'
        :tr.direction==='fading'?'<span class="dir dn">▼ נחלש</span>':'';
      var why=(c.reasons||[]).slice(0,2).map(function(x){return x.text}).join(' · ');
      var lv=(c.levels||[]).slice(0,3).map(function(x){return x.name+' '+x.price.toFixed(2)}).join(' · ');
      return '<div class="row '+band+'" data-s="'+r.symbol+'">'+
        '<div><div class="sym">'+r.symbol+'</div><div class="px num">'+(c.lastClose!=null?c.lastClose.toFixed(2):'—')+'</div></div>'+
        '<div><div class="why">'+(why||'—')+'</div>'+
        '<div class="meta"><span>מבנה <b>'+(STRUCT_TXT[c.structure]||c.structure||'—')+'</b></span>'+
        (c.atrPct!=null?'<span>טווח יומי <b>'+c.atrPct+'%</b></span>':'')+
        (c.relVol!=null?'<span>מחזור <b>×'+c.relVol+'</b></span>':'')+
        arrow+'</div>'+
        (lv?'<div class="lvls2">רמות למעקב: '+lv+'</div>':'')+
        (c.capReason?'<div class="cap">'+c.capReason+'</div>':'')+'</div>'+
        '<div class="rt"><div class="score">'+c.score+'<small>/100</small></div>'+
        (live[r.symbol]?'<span class="live">חי</span>':'<button type="button" class="track" data-s="'+r.symbol+'">למעקב</button>')+
        '<button type="button" class="hist" data-s="'+r.symbol+'">היסטוריה</button></div></div>';
    }).join('');
    [].forEach.call(document.querySelectorAll('.track'),function(b){b.onclick=function(e){e.stopPropagation();track(b.dataset.s,b)}});
    [].forEach.call(document.querySelectorAll('.hist'),function(b){b.onclick=function(e){e.stopPropagation();history(b.dataset.s)}});
  }
  // Add to the live set. The server pulls the session immediately, so the
  // radar shows it on its next refresh rather than after the next cron.
  var live={};
  function loadWatch(){
    return j('/watch').then(function(d){ live={}; (d.tracked||[]).forEach(function(s){live[s]=1}); watchRoom=d.room; },function(){});
  }
  // Live Interest is a question about the CURRENT session, so it needs today's
  // bars from D1 — not the archive. Only for symbols actually on the watchlist:
  // that is the whole point of the split.
  function loadLiveInterest(){
    var syms=Object.keys(live);
    if(!syms.length)return Promise.resolve();
    return j('/board').then(function(d){
      var by={};
      (d.rows||[]).forEach(function(r){ (by[r.symbol]=by[r.symbol]||[]).push(r) });
      syms.forEach(function(s){
        var rows=by[s];
        var st=store[s]||(store[s]={rows:[],days:{}});
        if(!rows||rows.length<20){ st.liveInterest=null; return; }
        rows.sort(function(a,b){return a.unix-b.unix});
        var A=analyze(rows,{K:3,minMove:1.5,runs:3});
        st.liveInterest=A?liveInterest(A,{}):null;
      });
    },function(){});
  }
  var watchRoom=null;
  function track(sym,btn){
    if(btn){btn.disabled=true;btn.textContent='…'}
    return j('/watch/add/'+sym).then(function(d){
      if(d.error){ toast(d.error==='watchlist full'?'המעקב מלא ('+d.max+'). הסר מניה ברדאר קודם.':d.error); if(btn){btn.disabled=false;btn.textContent='למעקב'} return; }
      live[sym]=1; toast(sym+' נוסף למעקב — יופיע ברדאר ברענון הבא'); render();
    },function(e){ toast('לא הצלחתי להוסיף: '+e); if(btn){btn.disabled=false;btn.textContent='למעקב'} });
  }

  // The date picker lists what the ARCHIVE holds, newest first.
  function drawDates(){
    var ds=dates.slice();
    if(!ds.length)ds=[shownDate||expectedSessionDate()];
    qs('#date').innerHTML=ds.map(function(x){return '<option value="'+x+'"'+(x===shownDate?' selected':'')+'>'+x.slice(5).replace('-','/')+'</option>'}).join('');
  }

  // Every day the archive holds for one symbol: counts, and a way to take the
  // raw candles away — copy for pasting, or the CSV file.
  function history(sym){
    var sheet=qs('#sheet'), panel=qs('#hpanel');
    sheet.hidden=false;
    panel.innerHTML='<div class="hhead"><b>'+sym+'</b><button type="button" id="hclose">סגור</button></div><div class="empty">טוען…</div>';
    qs('#hclose').onclick=function(){sheet.hidden=true};
    j('/archive/check/'+sym).then(function(d){
      var days=(d.detail||[]).slice().reverse();
      panel.innerHTML='<div class="hhead"><b>'+sym+'</b><span class="hsum">'+d.days+' ימים · '+d.bars.toLocaleString()+' נרות</span>'+
        '<div class="spacer"></div><button type="button" id="hclose">סגור</button></div>'+
        (days.length?'<div class="hdays">'+days.map(function(x){
          return '<div class="hd"><span>'+x.date+'</span><b class="num">'+x.bars+'</b>'+
            '<button type="button" class="hcopy" data-s="'+sym+'" data-d="'+x.date+'">העתק</button>'+
            '<a class="hdl" href="/export/'+sym+'/'+x.date+'">קובץ</a></div>';
        }).join('')+'</div>':'<div class="empty">אין ימים בארכיון עבור '+sym+'</div>')+
        '<div class="hall"><button type="button" id="copyAll" data-s="'+sym+'">העתק את כל הימים</button>'+
        '<a class="hdl" href="/export/'+sym+'">הורד הכל כקובץ</a></div>';
      qs('#hclose').onclick=function(){sheet.hidden=true};
      [].forEach.call(document.querySelectorAll('.hcopy'),function(b){b.onclick=function(){copyDay(b.dataset.s,b.dataset.d,b)}});
      var ca=qs('#copyAll'); if(ca)ca.onclick=function(){copyDay(ca.dataset.s,null,ca)};
    },function(e){ panel.innerHTML='<div class="hhead"><b>'+sym+'</b><button type="button" id="hclose">סגור</button></div>'+
      '<div class="empty">לא הצלחתי לקרוא: '+e+'</div>'; qs('#hclose').onclick=function(){sheet.hidden=true}; });
  }
  var CSV='symbol,date,time,open,high,low,close,volume';
  function copyDay(sym,date,btn){
    var label=btn?btn.textContent:''; if(btn){btn.disabled=true;btn.textContent='…'}
    // The same endpoint the download link uses, so copy and file can never
    // disagree about where the history came from.
    var u='/export/'+sym+(date?'/'+date:'');
    return fetch(bust(u),{cache:'no-store'}).then(function(r){return r.text()}).then(function(txt){
      var rows=txt.trim().split('\n').slice(1);
      var done=function(){toast(rows.length.toLocaleString()+' נרות הועתקו')};
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done,function(){prompt('העתק:',txt)});
      if(btn){btn.disabled=false;btn.textContent=label}
    },function(e){ toast('לא הצלחתי: '+e); if(btn){btn.disabled=false;btn.textContent=label} });
  }

  // Filling the gaps should be one button, not seven URLs pasted by hand. The
  // page knows which symbols have nothing for this day, so it asks for exactly
  // those, ten at a time, and reports progress.
  function fillMissing(){
    var btn=qs('#fill');
    try{
      var missing=symbols.filter(function(s){return !store[s]||!store[s].rows.length});
      if(!missing.length){setFill('כל המניות כבר בארכיון');return Promise.resolve()}
      btn.disabled=true;
      var total=missing.length, done=0, failed=[], lastErr=null;
      // Each batch is a real upstream pull of ~20 seconds, so the button has to
      // say what is happening — a page that looks frozen is indistinguishable
      // from one that is doing nothing.
      var step=function(){
        if(!missing.length)return Promise.resolve();
        var batch=missing.splice(0,10);
        btn.textContent='ממלא '+done+'/'+total+'…';
        setFill('מושך '+batch.join(', ')+' מיאהו — כ-20 שניות לקבוצה');
        return j('/archive/fill/'+batch.join(',')).then(function(d){
          if(d&&d.error){ lastErr=d.error; failed=failed.concat(batch); }
          else {
            (d.filled||[]).forEach(function(x){ if(x.error){failed.push(x.symbol);lastErr=x.error} });
            (d.skipped||[]).forEach(function(s){ missing.push(s); });
          }
          done+=batch.length;
          return step();
        },function(e){ lastErr=String(e); failed=failed.concat(batch); done+=batch.length; return step(); });
      };
      return step().then(function(){
        btn.disabled=false;
        setFill(failed.length?('נכשלו '+failed.length+': '+failed.slice(0,4).join(', ')+(lastErr?' — '+lastErr:'')):'הושלם — טוען מחדש');
        return loadAll();
      },function(e){ btn.disabled=false; setFill('נכשל: '+String(e)); });
    }catch(e){ if(btn)btn.disabled=false; setFill('נכשל: '+String(e&&e.message||e)); return Promise.resolve(); }
  }
  // A visible line, not a toast that vanishes in two seconds while a two-minute
  // job runs behind it.
  function setFill(msg){ var el=qs('#fillmsg'); if(el){el.hidden=!msg;el.textContent=msg||''} }
  qs('#fill').onclick=fillMissing;

  // The point of the scanner: surface what changed, so the 100 names do not have
  // to be read one by one during the session.
  function drawSuggestions(){
    var el=qs('#sugg'); if(!el)return;
    var scanList=symbols.filter(function(s){return !live[s]}).map(function(s){
      return {symbol:s,candidate:(store[s]||{}).cand,trend:(store[s]||{}).trend}});
    var watchList=Object.keys(live).map(function(s){
      return {symbol:s,candidate:(store[s]||{}).cand,live:(store[s]||{}).liveInterest||null}})
      .filter(function(x){return x.live});
    var g=suggestions(watchList,scanList,{max:40});
    if(!g.promote.length&&!g.demote.length){el.hidden=true;return}
    el.hidden=false;
    el.innerHTML='<div class="sh">מועמדים חדשים למעקב</div>'+
      (g.promote.length?g.promote.slice(0,5).map(function(p){
        return '<div class="sg"><div class="sgtop"><b>'+p.symbol+'</b><span class="sgs">'+p.score+'/100</span>'+
          (p.direction==='improving'?'<span class="dir up">▲ מתחזק</span>':'')+'</div>'+
          '<div class="sgw">'+p.why.join(' · ')+'</div>'+
          (p.directionText?'<div class="sgw">'+p.directionText+'</div>':'')+
          (p.insteadOf?'<div class="sgsw">המעקב מלא — שקול להסיר <b>'+p.insteadOf+'</b> ('+p.insteadOfWhy+')</div>':'')+
          '<button type="button" class="track" data-s="'+p.symbol+'">הוסף למעקב</button></div>';
      }).join(''):'<div class="sgnone">אין מועמדים חדשים כרגע</div>')+
      (g.demote.length?'<div class="sh">כבר לא מעניינים במעקב</div>'+g.demote.slice(0,5).map(function(x){
        return '<div class="sg"><div class="sgtop"><b>'+x.symbol+'</b><span class="sgs">'+x.score+'/100</span></div>'+
          '<div class="sgw">'+x.why.join(' · ')+'</div>'+
          '<div class="sgsw">שקול להסיר — ההחלטה שלך</div></div>';
      }).join(''):'')+
      '<div class="sgnote">המערכת ממליצה בלבד. שום מניה לא נכנסת או יוצאת מהמעקב מעצמה.</div>';
    [].forEach.call(el.querySelectorAll('.track'),function(b){b.onclick=function(){track(b.dataset.s,b)}});
  }

  qs('#sort').onchange=render;
  qs('#date').onchange=function(){viewDate=qs('#date').value;loadAll()};
  qs('#reload').onclick=function(){loadWatch().then(loadAll).then(function(){return loadLiveInterest()}).then(function(){render();toast('עודכן')})};
  // The archive moves on a ~50 minute cycle, so polling harder than every five
  // minutes buys nothing.
  // The archive moves on a ~50 minute cycle, but live interest is about the
  // current session and has to keep up with it.
  setInterval(function(){ if(!document.hidden)loadAll(); },5*60*1000);
  setInterval(function(){ if(!document.hidden)loadLiveInterest().then(render); },60*1000);

  loadWatch().then(loadAll).then(function(){return loadLiveInterest()}).then(render);
})();
</script>
</body>
</html>
