# Deploy the Worker to Cloudflare.
#
# Why this exists: the assistant can push to GitHub but has no access to
# Cloudflare, so every deploy needed a human at a laptop. With this workflow and
# one repository secret, a deploy can be triggered from the GitHub API or from a
# phone, and it runs the same `wrangler deploy` a laptop would.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - the account id from the Cloudflare dashboard URL
name: deploy

on:
  workflow_dispatch:          # manual, or via the API
    inputs:
      migrate:
        description: 'Also apply migrations/0001_v2_schema.sql to the remote D1'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'view.js'
      - 'v2_pipeline.js'
      - 'v2_routes.js'
      - 'wrangler.toml'
      - 'migrations/**'

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: write
  issues: write              # a failed deploy reports itself as an issue

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Build the page bundle
        run: node build-view.mjs

      - name: Apply the V2 migration (additive only)
        if: inputs.migrate
        run: npx wrangler d1 execute bars-vault --remote --file=migrations/0001_v2_schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The Actions log host is unreachable from the assistant's sandbox, so a
      # failed deploy reports its own reason as an issue, which the API can read.
      - name: Report the failure as an issue
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(tail -c 3000 /tmp/deploy.log | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g')
          python3 - "$BODY" <<'PY'
          import json, os, sys, urllib.request
          body = "```\n" + sys.argv[1] + "\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=json.dumps({"title": f"deploy failed: {os.environ['GITHUB_SHA'][:7]}", "body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY
          exit 1

      - name: Report what is live
        run: |
          echo "deployed commit: ${{ github.sha }}"
          curl -s https://spmo-market-bridge.noamharelnim.workers.dev/v2/status | head -c 600 || true
