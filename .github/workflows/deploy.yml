# Deploy the Worker to Cloudflare.
#
# Why this exists: the assistant can push to GitHub but has no access to
# Cloudflare, so every deploy needed a human at a laptop. With this workflow and
# one repository secret, a deploy can be triggered from the GitHub API or from a
# phone, and it runs the same `wrangler deploy` a laptop would.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - the account id from the Cloudflare dashboard URL
name: deploy

on:
  workflow_dispatch:          # manual, or via the API
    inputs:
      migrate:
        description: 'Also apply migrations/0001_v2_schema.sql to the remote D1'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'view.js'
      - 'v2_pipeline.js'
      - 'v2_routes.js'
      - 'wrangler.toml'
      - 'migrations/**'

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: write            # so a failed deploy can commit its own error log back

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Build the page bundle
        run: node build-view.mjs

      - name: Apply the V2 migration (additive only)
        if: inputs.migrate
        run: npx wrangler d1 execute bars-vault --remote --file=migrations/0001_v2_schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The Actions log host is unreachable from the assistant's sandbox, so a
      # failed deploy writes its own reason into the repository instead.
      - name: Publish the failure reason into the repo
        if: steps.deploy.outcome == 'failure'
        run: |
          mkdir -p .ci
          { echo "commit: ${{ github.sha }}"; echo "when: $(date -u)"; echo '---'; tail -c 4000 /tmp/deploy.log; } \
            | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' > .ci/last-deploy-error.txt
          git config user.name "deploy-bot"; git config user.email "deploy-bot@users.noreply.github.com"
          git add .ci/last-deploy-error.txt
          git commit -m "ci: record why the deploy failed" || exit 0
          git push
          exit 1

      - name: Report what is live
        run: |
          echo "deployed commit: ${{ github.sha }}"
          curl -s https://spmo-market-bridge.noamharelnim.workers.dev/v2/status | head -c 600 || true
