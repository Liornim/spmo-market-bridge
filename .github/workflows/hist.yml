# History files in R2: build (tools/hist_build.mjs) then check against the
# database (tools/hist_verify.mjs). Started by pushing .github/hist-request.json
# ({from, to, symbols, force}); the nightly run builds the newly closed month.
# Writes only R2 (through the Worker), never Supabase, so it has its own queue.
name: hist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/hist-request.json']
concurrency: { group: hist, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ebhycqdnmykgqubmfnvw.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail; mkdir -p .github/audit
          R=.github/hist-request.json
          export FROM=$(node -p "require('./$R').from||''") TO=$(node -p "require('./$R').to||''") SYMBOLS=$(node -p "[].concat(require('./$R').symbols||[]).join(',')") FORCE=$(node -p "require('./$R').force?1:''")
          node tools/hist_build.mjs 2>&1 | tee .github/audit/hist_build.log
      - name: Check against the database (months the database overlaps)
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          R=.github/hist-request.json
          export SYMBOLS=$(node -p "[].concat(require('./$R').symbols||[]).join(',')")
          M=""; for k in 0 1 2 3; do M="$M,$(date -u -d "$(date -u +%Y-%m-15) -$k month" +%Y-%m)"; done
          MONTHS="$M" node tools/hist_verify.mjs 2>&1 | tee .github/audit/hist_verify.log
      - name: Commit the logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audit/hist_build.log .github/audit/hist_verify.log; git commit -qm "hist: $(grep -h VERDICT .github/audit/hist_build.log .github/audit/hist_verify.log | tr '\n' ' ')" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Fail if a step failed
        if: steps.build.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 1
