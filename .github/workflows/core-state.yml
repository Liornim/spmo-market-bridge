# Current state of every symbol for the /core page ("מצב היום" tab).
# Runs after each export (the nightly candles-YYYY-MM-DD release) and writes
# core/current_state.json + core/current_state_latest.csv, which the Worker
# serves at /core/state and /core/state.csv. Script: tools/core/state.py.
name: core-state

on:
  workflow_run:
    workflows: [export]
    types: [completed]
  schedule:
    - cron: '0 8 * * *'     # fallback if the export trigger was missed
  workflow_dispatch:

concurrency:
  group: core-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  state:
    # an export that failed or was skipped published nothing new: do not rebuild (and commit) from the old release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy
      - name: Download the newest candles release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 50 --json tagName,createdAt --jq '[.[] | select(.tagName|startswith("candles-"))] | sort_by(.createdAt) | last | .tagName')
          echo "release: $TAG"
          mkdir -p /tmp/candles && gh release download "$TAG" -D /tmp/candles -p '*.zip'
          unzip -q -o /tmp/candles/*.zip -d /tmp/candles
      - name: Fill missing session bars in the frozen history (Yahoo daily)
        run: python tools/core/fill_gaps.py .
        continue-on-error: true
      - name: Earnings calendar
        run: python tools/core/earnings.py .
        continue-on-error: true
      - name: Build state
        run: python tools/core/state.py . /tmp/candles
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/current_state.json core/current_state_latest.csv core/daily_new.csv core/splits.json core/earnings.json core/history core/daily.csv.gz; if [ -f core/daily_filled.json ]; then git add core/daily_filled.json; fi
          git commit -qm "core-state $(python -c "import json;print(json.load(open('core/current_state.json'))['date'])")" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && ok=1 && break; sleep 9; done; [ $ok = 1 ] || { echo 'push failed'; exit 1; }
