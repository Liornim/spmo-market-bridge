# Quick read-only probes that must not wait behind the database queue
# (nightly / backfill share one concurrency group). Writes nothing to Supabase.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/probe-request.json'
concurrency:
  group: probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ebhycqdnmykgqubmfnvw.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        shell: bash
        run: |
          mkdir -p .github/audit
          eval "$(node -p "Object.entries(require('./.github/probe-request.json').env||{}).map(([k,v])=>'export '+k+'='+JSON.stringify(String(v))).join('\\n')")"
          for S in $(node -p "[].concat(require('./.github/probe-request.json').script).join(' ')"); do
            SYM=$(node -p "require('./.github/probe-request.json').sym||''") node "$S" > ".github/audit/$(basename "$S" .mjs).log" 2>&1 || true
            tail -80 ".github/audit/$(basename "$S" .mjs).log"
          done
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audit; git commit -qm "probe: $(node -p "require('./.github/probe-request.json').script")" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
