# Fill the Supabase mirror with the last 7 days of 1-minute bars, straight from
# Yahoo. Independent of the Worker and of D1: it costs no D1 reads or writes and
# none of the Worker's subrequests. Existing Supabase rows are never overwritten.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions),
# the same values the Worker has:
#   SUPABASE_URL   https://<project>.supabase.co
#   SUPABASE_KEY   the service_role key (Supabase -> Project Settings -> API)
# With dry_run the secrets are not needed: it only fetches and reports.
name: supabase-backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch from Yahoo and report only; write nothing'
        type: boolean
        default: false
      symbols:
        description: 'Optional comma list (default: every tracked symbol)'
        type: string
        default: ''
      range:
        description: 'Yahoo range for 1m bars (7d is the maximum)'
        type: string
        default: '7d'
  # Also runs when .github/backfill-request.json is pushed, so a session that
  # can push but cannot call the Actions API can still start it. The file holds
  # {"dry_run": bool, "symbols": "", "range": "7d"}.
  push:
    branches: [main]
    paths:
      - '.github/backfill-request.json'

concurrency:
  group: supabase-backfill
  cancel-in-progress: false

permissions:
  contents: write          # the run commits its report, readable without a GitHub login

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYMBOLS: ${{ inputs.symbols }}
          RANGE: ${{ inputs.range }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export DRY_RUN=$(node -p "String(require('./.github/backfill-request.json').dry_run === true)")
            export SYMBOLS=$(node -p "require('./.github/backfill-request.json').symbols || ''")
            export RANGE=$(node -p "require('./.github/backfill-request.json').range || '7d'")
          fi
          W=https://spmo-market-bridge.noamharelnim.workers.dev
          for path in / /status /table/symbols /usage; do
            echo "=== GET $path" ; curl -sS -m 30 -A 'Mozilla/5.0' -w '\n[HTTP %{http_code}]\n' "$W$path?cb=$(date +%s)" | head -c 1500; echo
          done 2>&1 | tee backfill.log
          node tools/supabase_backfill.mjs 2>&1 | tee -a backfill.log; exit ${PIPESTATUS[0]}
      - name: Commit the report
        if: always()
        run: |
          {
            echo "# supabase-backfill run ${{ github.run_number }} (${{ github.event_name }}) — $(date -u +%FT%TZ)"
            echo
            echo '```'
            tail -n 200 backfill.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > .github/backfill-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/backfill-report.md
          git commit -m "supabase-backfill: report for run ${{ github.run_number }}" || exit 0
          git pull --rebase -q && git push -q
