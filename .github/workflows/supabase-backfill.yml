# Fill the Supabase mirror with the last 7 days of 1-minute bars, straight from
# Yahoo. Independent of the Worker and of D1: it costs no D1 reads or writes and
# none of the Worker's subrequests. Existing Supabase rows are never overwritten.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions),
# the same values the Worker has:
#   SUPABASE_URL   https://<project>.supabase.co
#   SUPABASE_KEY   the service_role key (Supabase -> Project Settings -> API)
# With dry_run the secrets are not needed: it only fetches and reports.
name: supabase-backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch from Yahoo and report only; write nothing'
        type: boolean
        default: false
      symbols:
        description: 'Optional comma list (default: every tracked symbol)'
        type: string
        default: ''
      range:
        description: 'Yahoo range for 1m bars (7d is the maximum)'
        type: string
        default: '7d'
  # Also runs when .github/backfill-request.json is pushed, so a session that
  # can push but cannot call the Actions API can still start it. The file holds
  # {"dry_run": bool, "symbols": "", "range": "7d"}.
  push:
    branches: [main]
    paths:
      - '.github/backfill-request.json'

concurrency:
  group: supabase-backfill
  cancel-in-progress: false

permissions:
  contents: write          # the run commits its report, readable without a GitHub login

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ebhycqdnmykgqubmfnvw.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYMBOLS: ${{ inputs.symbols }}
          RANGE: ${{ inputs.range }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export DRY_RUN=$(node -p "String(require('./.github/backfill-request.json').dry_run === true)")
            export SYMBOLS=$(node -p "require('./.github/backfill-request.json').symbols || ''")
            export RANGE=$(node -p "require('./.github/backfill-request.json').range || '7d'")
            export DAYS=$(node -p "require('./.github/backfill-request.json').days || 0")
            export TARGET=$(node -p "require('./.github/backfill-request.json').target || 'bars'")
          fi
          W=https://spmo-market-bridge.noamharelnim.workers.dev
          for path in / /status /table/symbols /usage; do
            echo "=== GET $path" ; curl -sS -m 30 -A 'Mozilla/5.0' -w '\n[HTTP %{http_code}]\n' "$W$path?cb=$(date +%s)" | head -c 1500; echo
          done 2>&1 | tee backfill.log
          TASK=$(node -p "require('./.github/backfill-request.json').task || 'backfill'" 2>/dev/null || echo backfill)
          if [ "$TASK" = "probe_archive_page" ]; then
            for s in AAPL ALAB SPY WMT; do
              curl -sS -m 60 -D /tmp/h.txt -o /tmp/x.csv "$W/xa/export/$s?cb=$(date +%s)"
              echo "$s: HTTP $(head -1 /tmp/h.txt | cut -d' ' -f2) rows=$(grep -i '^x-rows' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2) truncated=$(grep -i '^x-truncated' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2) lines=$(wc -l < /tmp/x.csv) first=$(sed -n 2p /tmp/x.csv | cut -d, -f2,3) last=$(tail -1 /tmp/x.csv | cut -d, -f2,3)"
            done 2>&1 | tee -a backfill.log
            curl -sS -m 60 "$W/xa/daily?symbols=AAPL&from=2026-10-05&to=2026-10-06" | head -c 700 | tee -a backfill.log; echo | tee -a backfill.log
            curl -sS -m 60 -o /dev/null -w 'archive-bars page HTTP %{http_code} size %{size_download}\n' "$W/archive-bars" | tee -a backfill.log
            exit 0
          fi
          # Any checked-in script: {"task":"run_script","script":"tools/x.mjs"}. Its
          # stdout is the report; files it writes under .github/audit/ are committed.
          if [ "$TASK" = "run_script" ]; then
            mkdir -p .github/audit; rc=0
            for SCRIPT in $(node -p "[].concat(require('./.github/backfill-request.json').script).join(' ')"); do
              echo "##### $SCRIPT" | tee -a backfill.log
              node "$SCRIPT" > ".github/audit/$(basename "$SCRIPT" .mjs).log" 2>&1 || rc=1
              tail -n 120 ".github/audit/$(basename "$SCRIPT" .mjs).log" | tee -a backfill.log
            done
            exit $rc
          fi
          if [ "$TASK" = "verify_archive" ]; then export VERIFY_ONLY=1; TASK=archive_from_bars; fi
          if [ "$TASK" = "archive_from_bars" ]; then
            node tools/archive_from_bars.mjs 2>&1 | tee -a backfill.log; exit ${PIPESTATUS[0]}
          fi
          node tools/supabase_backfill.mjs 2>&1 | tee -a backfill.log; exit ${PIPESTATUS[0]}
      - name: Commit the report
        if: always()
        run: |
          {
            echo "# supabase-backfill run ${{ github.run_number }} (${{ github.event_name }}) — $(date -u +%FT%TZ)"
            echo
            echo '```'
            tail -n 400 backfill.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > .github/backfill-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/backfill-report.md
          git add .github/audit 2>/dev/null || true
          git commit -m "supabase-backfill: report for run ${{ github.run_number }}" || exit 0
          git pull --rebase -q && git push -q
