# Nightly database build, 00:00 Israel time (after the US close); later crons are retries.
#
#   1. Alpaca SIP -> archive_bars: every regular-session minute of the last 60
#      days (the whole archive) compared with Alpaca exactly; missing minutes
#      inserted, differing ones corrected, non-session rows deleted. (Yahoo until
#      2026-10-09; it answered the same minute differently between requests.)
#   2. archive -> bars (the main table): the last 7 sessions copied from the archive.
#   3. bars -> archive_bars: everything in the main table is copied to the archive,
#      so the archive always holds the main table's 7 days as well (by design).
#   4. Trim bars to exactly the last 7 sessions — per symbol, and only after
#      checking the archive holds what is about to be deleted.
#   5. Verification team: full row-by-row audit, an independent per-day count
#      check, an independent accuracy check against Yahoo, and the main-table check.
#   6. Verdict -> .github/audit/LATEST.md and nightly/<date>.md; a FAIL opens an
#      issue, which GitHub emails to the repository owner.
#
# GitHub cron is UTC and has no time zones: 21:00 UTC is 00:00 in Israel in
# summer (UTC+3) and 22:00 UTC is 00:00 in winter (UTC+2). Both are scheduled;
# the guard runs only the one that lands in the 00:xx-01:xx Israel hour, once a day.
name: nightly

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 1 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/nightly-request.json'

concurrency:
  group: supabase-backfill
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash      # with pipefail, so `cmd | tee log` fails when cmd fails

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ebhycqdnmykgqubmfnvw.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard (once a night, at 00:xx Israel time)
        id: guard
        run: |
          H=$(TZ=Asia/Jerusalem date +%H); D=$(TZ=Asia/Jerusalem date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            # an on-demand run from the "Update DB" tab: symbols (empty = all) and days back
            if [ -f .github/nightly-request.json ]; then
              echo "symbols=$(node -p "[].concat(require('./.github/nightly-request.json').symbols||[]).join(',')")" >> "$GITHUB_OUTPUT"
              echo "days=$(node -p "Math.min(60,Math.max(1,+require('./.github/nightly-request.json').days||30))")" >> "$GITHUB_OUTPUT"
              echo "request_id=$(node -p "require('./.github/nightly-request.json').request_id||''")" >> "$GITHUB_OUTPUT"
            fi
            echo "manual=1" >> "$GITHUB_OUTPUT"; echo "go=1" >> "$GITHUB_OUTPUT"
            # a check that does not run must show as "did not run", not as last run's result
            rm -f .github/audit/{archive_audit.csv,qa_count.csv,qa_accuracy.csv,register.log,archive_sync.log,ext_sync.log,fill_bars.log,copy_to_archive.log,bars_trim.log,bars_trim.csv}; exit 0
          fi
          # GitHub delays scheduled runs, sometimes by hours (on 2026-10-08 both
          # 00:00 crons started after 02:00 and skipped). Any cron between 00:00
          # and 10:59 Israel time runs it, once per date; the later crons are retries.
          case "$H" in 00|01|02|03|04|05|06|07|08|09|10) ;; *) echo "Israel hour $H: outside 00-10"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if [ -f ".github/audit/nightly/$D.md" ]; then echo "already ran for $D"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"
          rm -f .github/audit/{archive_audit.csv,qa_count.csv,qa_accuracy.csv,register.log,archive_sync.log,ext_sync.log,fill_bars.log,copy_to_archive.log,bars_trim.log,bars_trim.csv}

      - name: 0. Register new symbols (only when requested)
        if: steps.guard.outputs.go == '1' && steps.guard.outputs.symbols != ''
        run: |
          mkdir -p .github/audit; rm -f /tmp/accepted_symbols.txt
          REQ_SYMBOLS="${{ steps.guard.outputs.symbols }}" node tools/register_symbols.mjs 2>&1 | tee .github/audit/register.log

      - name: 0b. Company names for new symbols (data/names.json)
        if: steps.guard.outputs.go == '1'
        continue-on-error: true
        run: node tools/names_sync.mjs 2>&1 | tail -3

      - name: 1. Alpaca (all exchanges) -> archive (sync the last N days; all or the requested symbols)
        if: steps.guard.outputs.go == '1'
        run: |
          mkdir -p .github/audit
          SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" DAYS="${{ steps.guard.outputs.days || 60 }}" node tools/archive_sync.mjs 2>&1 | tee .github/audit/archive_sync.log

      - name: 1b. Alpaca (all exchanges) -> pre/after-market archive (archive_ext_bars)
        if: steps.guard.outputs.go == '1'
        continue-on-error: true     # a pre/after failure is reported, but must not stop the main table
        run: |
          D="${{ steps.guard.outputs.days || 30 }}"; [ "$D" -gt 29 ] && D=29
          SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" DAYS="$D" node tools/ext_sync.mjs 2>&1 | tee .github/audit/ext_sync.log

      # Rewriting all 7 sessions every night left ~350K dead row versions behind
      # each time (Postgres keeps the old version of an updated row until VACUUM),
      # which is what grew `bars` to 270MB for 70MB of data. The copy from the
      # archive writes only the minutes that differ.
      - name: 2. Archive -> main table (the last 7 sessions, written only where they differ)
        if: steps.guard.outputs.go == '1'
        run: SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" node tools/bars_from_archive.mjs 2>&1 | tee .github/audit/fill_bars.log

      # From here on, an on-demand update of chosen symbols touches and checks
      # only those symbols (SYMBOLS = the accepted list); a full refresh and the
      # nightly run (no list) cover the whole database with the full test set.
      - name: 3. Main table -> archive (copy)
        if: steps.guard.outputs.go == '1'
        run: SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" node tools/archive_from_bars.mjs 2>&1 | tee .github/audit/copy_to_archive.log

      - name: 4. Trim main table to 7 sessions
        if: steps.guard.outputs.go == '1'
        run: SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" node tools/bars_trim.mjs 2>&1 | tee .github/audit/bars_trim.log

      - name: 5a. Full audit (every row)
        if: always() && steps.guard.outputs.go == '1'
        run: |
          if [ -n "${{ steps.guard.outputs.symbols }}" ] && [ ! -s /tmp/accepted_symbols.txt ]; then echo "no accepted symbols - nothing to check"; exit 0; fi
          SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" node tools/archive_audit.mjs > .github/audit/archive_audit.log 2>&1 || true

      - name: 5b. Independent count check
        if: always() && steps.guard.outputs.go == '1'
        run: |
          if [ -n "${{ steps.guard.outputs.symbols }}" ] && [ ! -s /tmp/accepted_symbols.txt ]; then echo "no accepted symbols - nothing to check"; exit 0; fi
          SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)" node tools/qa_count_check.mjs > .github/audit/qa_count_check.log 2>&1 || true

      - name: 5c. Independent accuracy check vs Alpaca
        if: always() && steps.guard.outputs.go == '1'
        run: |
          if [ -n "${{ steps.guard.outputs.symbols }}" ] && [ ! -s /tmp/accepted_symbols.txt ]; then echo "no accepted symbols - nothing to check"; exit 0; fi
          export QA_FROM=$(date -u -d '55 days ago' +%F) QA_TO=$(TZ=America/New_York date +%F)
          export SYMBOLS="$(cat /tmp/accepted_symbols.txt 2>/dev/null)"
          # chosen symbols: compare every day with Alpaca, not a sample of 3
          if [ -n "$SYMBOLS" ]; then export QA_DAYS_PER_SYMBOL=30; fi
          node tools/qa_accuracy_check.mjs > .github/audit/qa_accuracy_check.log 2>&1 || true

      - name: 6. Verdict
        id: verdict
        if: always() && steps.guard.outputs.go == '1'
        env:
          MANUAL: ${{ steps.guard.outputs.manual }}
          REQUEST_ID: ${{ steps.guard.outputs.request_id }}
          REQ_SYMBOLS: ${{ steps.guard.outputs.symbols }}
          REQ_DAYS: ${{ steps.guard.outputs.days }}
        run: node tools/nightly_verdict.mjs

      - name: Commit the report
        if: always() && steps.guard.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audit data/names.json
          git commit -qm "nightly ${{ steps.guard.outputs.date }}: $(head -1 .github/audit/LATEST.md 2>/dev/null | sed 's/^# //')" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Open an issue on failure
        if: failure() && steps.guard.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Nightly ${{ steps.guard.outputs.date }} FAILED" \
            --body "$(cat .github/audit/LATEST.md 2>/dev/null || echo 'no report — see the run log')

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
