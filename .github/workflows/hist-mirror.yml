# Mirror the R2 history files to the GitHub Release "history" (one zip per
# symbol + manifest.json), so tools that cannot reach *.workers.dev — Claude
# sessions included — can still download them from github.com.
# Runs after every hist and nightly run (only changed symbols are uploaded),
# or on demand by pushing .github/hist-mirror-request.json.
name: hist-mirror
on:
  workflow_dispatch:
  workflow_run:
    workflows: [hist, nightly]
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/hist-mirror-request.json']
concurrency: { group: hist-mirror, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail; mkdir -p .github/audit
          node tools/hist_mirror.mjs 2>&1 | tee .github/audit/hist_mirror.log
      - name: Commit the log
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audit/hist_mirror.log; git commit -qm "hist-mirror: $(grep -h MIRROR_VERDICT .github/audit/hist_mirror.log)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
