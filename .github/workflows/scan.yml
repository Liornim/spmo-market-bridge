# Opportunity Scanner (docs/OPPORTUNITY_SCANNER_SPEC.md).
# Every 30 minutes during the US session, and once after the nightly build.
# Results: scan/latest.json + two CSVs, served to the "Opportunity Scanner" tab
# at /archive-bars through the Worker route /xa/scan.
name: scan

on:
  schedule:
    - cron: '5,35 13-20 * * 1-5'      # 09:05..16:35 ET in summer, 08:05..15:35 in winter
    - cron: '30 22 * * *'             # after the nightly build (00:00 Israel)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scan-request.json'

concurrency:
  group: scanner
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://ebhycqdnmykgqubmfnvw.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Engine tests
        run: node tools/scanner/engine_test.mjs
      - name: Scan
        run: mkdir -p scan && node tools/scanner/run_scan.mjs | tee scan/summary.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan
          git commit -qm "scan $(date -u +%FT%TZ): $(head -4 scan/summary.txt | tr '\n' ' ')" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
