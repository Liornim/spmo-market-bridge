# Financial statements straight from SEC EDGAR (companyfacts) for the /core stocks.
# Output: core/sec/<TICKER>.json (annual, quarterly incl. derived quarters, TTM). Script: tools/core/sec_facts.py.
# Runs weekly and on request; optional input "tickers" (comma list) limits the run.
name: sec-facts

on:
  schedule:
    - cron: '30 9 * * 6'    # Saturdays
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma list (empty = all stocks)'
        type: string
        default: ''

concurrency:
  group: sec-facts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from SEC
        run: python tools/core/sec_facts.py . "${{ inputs.tickers }}"
      - run: pip install -q pandas numpy
      - name: CORE screen on SEC numbers (latest period, TTM)
        run: python tools/core/screen_sec.py .
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild the /core page data and Excel (EDGAR)
        run: pip install -q openpyxl && python tools/core/build_core_data.py . && node build-view.mjs
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/sec core/screen_sec.csv core/core_data.json core/CORE_list.xlsx view.js VERSION
          git commit -qm "sec-facts $(date -u +%F)" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && ok=1 && break; sleep 9; done; [ $ok = 1 ] || { echo 'push failed'; exit 1; }
