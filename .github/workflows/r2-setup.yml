# One-off: create the R2 bucket for the history files and report what Cloudflare says.
# The sandbox cannot reach api.cloudflare.com; this job asks and commits the answer.
name: r2-setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/r2-setup-request.json']
concurrency: { group: r2-setup, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Create bucket / list buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .github/audit
          { echo "## r2 setup $(date -u +%FT%TZ)"; echo '### create bars-history';
            npx -y wrangler@4 r2 bucket create bars-history 2>&1 | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' | tail -15;
            echo '### list'; npx -y wrangler@4 r2 bucket list 2>&1 | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' | tail -15; } > .github/audit/r2_setup.log 2>&1 || true
          cat .github/audit/r2_setup.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audit/r2_setup.log; git commit -qm "r2 setup report" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
