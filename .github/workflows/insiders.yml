# Insider open-market trades (SEC Form 4, last 90 days) for every stock -> core/insiders.json.
# Information only (the frozen method does not use it). Source: SEC EDGAR only.
# workflow_dispatch input `symbols` = test run for a few symbols, prints the rows, writes nothing.
name: insiders
on:
  schedule:
    - cron: '40 22 * * 1-5'     # 18:40 New York (EDT): after the close; Form 4 is due 2 business days after a trade
  workflow_dispatch:
    inputs:
      symbols:
        description: 'test only these symbols (space separated); empty = all, and commit'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/core/insiders.py ${{ inputs.symbols }}
      - name: Commit
        if: ${{ !inputs.symbols }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/insiders.json
          git commit -qm "insiders $(date -u +%F)" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && ok=1 && break; sleep 9; done; [ $ok = 1 ]
