<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>נרות שמורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F2F4F7;--ink:#1B2430;--muted:#5B6673;--rule:#D6DBE2;--well:#FFFFFF;--up:#0F766E;--down:#B42318;--flat:#8A94A0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;max-width:100%;overflow-x:hidden}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
  .top{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex-wrap:wrap}
  .top h1{font-size:18px;font-weight:800;margin:0}
  .spacer{flex:1}
  .build{font-size:10px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
  a.back{font-size:13px;color:var(--ink);text-decoration:none;background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 10px}
  .pick{display:flex;gap:8px;padding:0 14px 10px;flex-wrap:wrap;align-items:center}
  select,input{font:inherit;font-size:15px;background:var(--well);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0}
  select{max-width:46vw}
  input{width:120px}
  .sum{padding:0 14px 10px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .sum b{color:var(--ink);font-weight:600;direction:ltr;unicode-bidi:isolate}
  .days{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:none;background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink);white-space:nowrap}
  .day.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .day small{display:block;font-size:10.5px;color:var(--muted);text-align:center}
  .day.on small{color:var(--paper);opacity:.8}
  .day.short{border-color:#E4B4AD}
  table{width:100%;border-collapse:collapse;direction:ltr;font-size:13px}
  th{position:sticky;top:0;background:var(--paper);color:var(--muted);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--rule);font-size:11.5px}
  td{padding:6px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:14px;font-weight:600}
  th:last-child,td:last-child{padding-right:14px}
  tr.up td.c{color:var(--up)} tr.down td.c{color:var(--down)}
  tr.quiet td{color:var(--muted)}
  tr.gap td{background:#FBEAE7}
  .msg{padding:40px 16px;text-align:center;color:var(--muted);line-height:1.6}
  .msg b{color:var(--ink)}
  .acts{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}
  button{font:inherit;font-size:13px;background:var(--well);border:1px solid var(--rule);color:var(--ink);border-radius:10px;padding:7px 12px}
  button.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .range{margin:0 14px 10px;background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:12px}
  .range[hidden]{display:none}
  .range label{font-size:12.5px;color:var(--muted);display:block}
  .range .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .range input[type=date]{width:100%;margin-top:3px}
  .range .est{font-size:13px;line-height:1.6;margin-top:10px;padding:9px 11px;background:var(--paper);border-radius:9px}
  .range .est b{font-weight:800}
  .range .est.warn{background:#FBEED0;color:#8A5B12} .range .est.bad{background:#F6DAD6;color:var(--down)}
  .range .r3{display:flex;gap:8px;margin-top:10px}
  .prog{margin:0 14px 10px;padding:9px 12px;background:var(--well);border:1px solid var(--rule);border-radius:10px;font-size:13px}
  .prog[hidden]{display:none}
  /* Nine columns do not fit a phone. Without this the last four were simply
     off-screen with no way to reach them. */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 14px;
    background:var(--well);border:1px solid var(--rule);border-radius:11px}
  .scroll table{min-width:640px}
  .r2x{display:flex;gap:6px;width:100%;margin-top:6px}
  .r2x input{flex:1;min-width:0}
  .tabs{display:flex;gap:6px;padding:0 14px 10px}
  .tab{font:inherit;font-size:13.5px;background:none;border:1px solid var(--rule);color:var(--muted);
    border-radius:9px;padding:7px 13px}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
  tr.part td{background:#FBEED0}
  td.pos{color:var(--up)} td.neg{color:var(--down)}
  th.s{cursor:pointer;user-select:none;white-space:nowrap}
  th.s:hover{color:var(--ink)}
  th.s.on{color:var(--ink);font-weight:800}
  th.s .ar{font-size:9px;margin-right:3px;opacity:.8}
  .srcp{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60}
  .toast[hidden]{display:none}
  @media(min-width:720px){ .wrap{max-width:900px;margin:0 auto} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>נרות שמורים</h1>
    <div class="spacer"></div>
    <a class="back" href="/radar">רדאר</a>
    <span class="build"><!--BUILD--></span>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" id="tabDay">נרות דקה</button>
    <button type="button" class="tab" id="tabDaily">מחירים יומיים</button>
  </div>
  <div class="pick" id="pickMin">
    <select id="sym" aria-label="סימבול"><option>טוען…</option></select>
    <input id="find" placeholder="חפש סימבול" autocomplete="off" autocapitalize="characters">
    <span id="count" style="font-size:12.5px;color:var(--muted)"></span>
  </div>
  <div class="days" id="days"></div>
  <div class="sum" id="sum"></div>
  <div class="pick" id="pickDaily" hidden>
    <select id="dSym"><option value="">כל המניות</option></select>
    <select id="dRange">
      <option value="7">7 ימים אחרונים</option>
      <option value="30" selected>30 ימים אחרונים</option>
      <option value="90">90 ימים אחרונים</option>
      <option value="0">כל הימים</option>
      <option value="x">טווח מדויק…</option>
    </select>
    <span id="dCount" style="font-size:12.5px;color:var(--muted)"></span>
    <div class="r2x" id="dExact" hidden>
      <input id="dFrom" type="date"><input id="dTo" type="date">
      <button type="button" id="dGo" class="dark">הצג</button>
    </div>
  </div>
</header>
<div class="acts">
  <button type="button" id="copy" class="dark">העתק CSV</button>
  <button type="button" id="order">ישן למעלה</button>
  <button type="button" id="dl">הורד יום</button>
  <button type="button" id="dlAll">הורד כל ההיסטוריה של הסימבול</button>
  <button type="button" id="dlRange">הורד הכל לטווח תאריכים</button>
</div>
<div class="range" id="range" hidden>
  <div class="r2">
    <label>מתאריך<input type="date" id="rFrom"></label>
    <label>עד תאריך<input type="date" id="rTo"></label>
  </div>
  <label style="margin-top:8px"><input type="checkbox" id="rTracked"> רק מניות במעקב חי (במקום כל הסימבולים)</label>
  <div class="est" id="rEst"></div>
  <div class="r3">
    <button type="button" id="rGo" class="dark">בדוק גודל</button>
    <button type="button" id="rCancel">ביטול</button>
  </div>
</div>
<div class="prog" id="prog" hidden></div>
<div class="scroll" id="tbl"><div class="msg">בחר סימבול</div></div>
<div id="dailyWrap" hidden>
  <div class="acts">
    <button type="button" id="dCopy" class="dark">העתק CSV</button>
    <button type="button" id="dDl">הורד CSV</button>
  </div>
  <div class="scroll" id="dTbl"><div class="msg">לחץ "הצג"</div></div>
</div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var qs=function(s){return document.querySelector(s)};
  var SYM='', DATE='', rows=[], days=[], newestFirst=false, all=[];
  var mSort='time', mDir=-1;
  function j(u){return fetch(u+(u.indexOf('?')>0?'&':'?')+'ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()})}
  function toast(m){var t=qs('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},1600)}
  function fmtK(v){return v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?Math.round(v/1e3)+'K':String(v)}

  // 1. every symbol that exists anywhere
  function loadIndex(){
    return j('/bars/index').then(function(d){
      all=d.symbols||[]; tracked=d.tracked||[];
      qs('#dSym').innerHTML='<option value="">כל המניות ('+all.length+')</option>'+
        all.map(function(s){return '<option>'+s+'</option>'}).join('');
      qs('#count').textContent=all.length+' סימבולים · '+(d.tracked||[]).length+' במעקב חי';
      drawSymbols(all);
      var want=(location.hash||'').replace('#','').toUpperCase();
      SYM=all.indexOf(want)>=0?want:(all[0]||'');
      qs('#sym').value=SYM;
      if(SYM)return loadDays();
    });
  }
  function drawSymbols(list){
    qs('#sym').innerHTML=list.map(function(s){return '<option'+(s===SYM?' selected':'')+'>'+s+'</option>'}).join('')||'<option>אין</option>';
  }
  // 2. which days this symbol has, and how complete each is
  function loadDays(){
    qs('#days').innerHTML='';qs('#sum').textContent='טוען ימים…';
    return j('/days/'+SYM).then(function(d){
      days=(d.days||[]);
      if(!days.length){qs('#sum').textContent='אין ימים שמורים ל-'+SYM;qs('#tbl').innerHTML='<div class="msg"><b>אין נרות ל-'+SYM+'</b></div>';return}
      DATE=days[0].date;
      drawDays(); return loadDay();
    });
  }
  function drawDays(){
    qs('#days').innerHTML=days.map(function(d){
      var n=d.bars||0, short=n>0&&n<370;
      return '<button type="button" class="day'+(d.date===DATE?' on':'')+(short?' short':'')+'" data-d="'+d.date+'">'+
        d.date.slice(5).replace('-','/')+'<small>'+n+' נרות'+(short?' ✗':'')+'</small></button>';
    }).join('');
    qs('#days').onclick=function(e){var b=e.target.closest('.day');if(!b)return;DATE=b.dataset.d;drawDays();loadDay()};
  }
  // 3. the candles of one day. /day merges D1 and the archive itself.
  function loadDay(){
    qs('#tbl').innerHTML='<div class="msg">טוען '+SYM+' · '+DATE+'…</div>';
    return j('/day/'+SYM+'/'+DATE+'?format=json').then(function(d){
      rows=(d.rows||[]).slice().sort(function(a,b){return a.unix-b.unix});
      history.replaceState(null,'','/bars#'+SYM);
      render(d);
    },function(e){qs('#tbl').innerHTML='<div class="msg"><b>שגיאה</b><br>'+String(e)+'</div>'});
  }
  function render(d){
    if(!rows.length){qs('#sum').textContent='אין נרות ל-'+SYM+' ב-'+DATE;qs('#tbl').innerHTML='<div class="msg"><b>ריק</b></div>';return}
    var first=rows[0], last=rows[rows.length-1];
    var hi=Math.max.apply(null,rows.map(function(r){return r.high})), lo=Math.min.apply(null,rows.map(function(r){return r.low}));
    var vol=rows.reduce(function(a,r){return a+r.volume},0);
    var quiet=rows.filter(function(r){return r.volume===0&&r.high===r.low}).length;
    // holes: consecutive bars more than a minute apart, inside the session
    var holes=0; for(var i=1;i<rows.length;i++){ if(rows[i].unix-rows[i-1].unix>60) holes+=Math.round((rows[i].unix-rows[i-1].unix)/60)-1; }
    qs('#sum').innerHTML='<b>'+SYM+'</b> · '+DATE+' · <b>'+rows.length+'</b> נרות · '+first.time+'–'+last.time+
      ' · פתיחה <b>'+first.open.toFixed(2)+'</b> גבוה <b>'+hi.toFixed(2)+'</b> נמוך <b>'+lo.toFixed(2)+'</b> סגירה <b>'+last.close.toFixed(2)+'</b>'+
      ' · נפח <b>'+fmtK(vol)+'</b>'+(quiet?' · '+quiet+' דקות ללא עסקה':'')+(holes?' · <span style="color:var(--down)">'+holes+' דקות חסרות</span>':'')+
      (d.source?' · מקור: '+d.source:'');
    var MCOL={time:{t:'שעה',v:function(r){return r.time}},open:{t:'פתיחה',v:function(r){return r.open}},
      high:{t:'גבוה',v:function(r){return r.high}},low:{t:'נמוך',v:function(r){return r.low}},
      close:{t:'סגירה',v:function(r){return r.close}},volume:{t:'נפח',v:function(r){return r.volume}}};
    // Sorting by time keeps the existing newest/oldest toggle as its direction,
    // so the two controls agree instead of fighting each other.
    var order;
    if(mSort==='time'){ order=newestFirst?rows.slice().reverse():rows.slice(); }
    else {
      var col=MCOL[mSort];
      order=rows.slice().sort(function(a,b){
        var x=col.v(a),y=col.v(b);
        if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
        return typeof x==='number'?(x-y)*mDir:String(x).localeCompare(String(y))*mDir;
      });
    }
    var mth=function(k){
      var on=mSort===k, arrow=k==='time'?(newestFirst?'▼':'▲'):(mDir<0?'▼':'▲');
      return '<th class="s'+(on?' on':'')+'" data-c="'+k+'">'+MCOL[k].t+(on?'<span class="ar">'+arrow+'</span>':'')+'</th>';
    };
    var h='<table><thead><tr>'+['time','open','high','low','close','volume'].map(mth).join('')+'</tr></thead><tbody>';
    order.forEach(function(r,i){
      var idx=rows.indexOf(r);
      var gap=idx>0&&rows[idx].unix-rows[idx-1].unix>60;
      var cls=(r.close>r.open?'up':r.close<r.open?'down':'flat')+((r.volume===0&&r.high===r.low)?' quiet':'')+(gap?' gap':'');
      h+='<tr class="'+cls+'"><td>'+r.time+'</td><td>'+r.open.toFixed(2)+'</td><td>'+r.high.toFixed(2)+'</td><td>'+r.low.toFixed(2)+'</td><td class="c">'+r.close.toFixed(2)+'</td><td>'+fmtK(r.volume)+'</td></tr>';
    });
    qs('#tbl').innerHTML=h+'</tbody></table>';
    var mh=qs('#tbl').querySelector('thead');
    if(mh)mh.onclick=function(e){
      var c=e.target.closest('.s'); if(!c)return;
      var k=c.dataset.c;
      if(k==='time'){ mSort='time'; newestFirst=!newestFirst;
        qs('#order').textContent=newestFirst?'חדש למעלה':'ישן למעלה'; }
      else if(mSort===k)mDir=-mDir;
      else {mSort=k;mDir=-1}
      render({});
    };
  }
  function csv(){
    return ['symbol,date,time,open,high,low,close,volume'].concat(rows.map(function(r){
      return [SYM,DATE,r.time,r.open,r.high,r.low,r.close,r.volume].join(',');
    })).join('\n');
  }
  qs('#sym').onchange=function(){SYM=this.value;loadDays()};
  qs('#find').oninput=function(){
    var q=this.value.trim().toUpperCase();
    var list=q?all.filter(function(s){return s.indexOf(q)===0}):all;
    drawSymbols(list);
    if(list.length&&list.indexOf(SYM)<0){SYM=list[0];qs('#sym').value=SYM;loadDays()}
  };
  qs('#order').onclick=function(){newestFirst=!newestFirst;mSort='time';
    this.textContent=newestFirst?'חדש למעלה':'ישן למעלה';render({})};
  qs('#copy').onclick=function(){
    if(!rows.length)return;
    var t=csv();
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('הועתק '+rows.length+' נרות')},function(){prompt('העתק:',t)});
  };
  qs('#dl').onclick=function(){
    if(!rows.length)return;
    var blob=new Blob([csv()],{type:'text/csv'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=SYM+'_'+DATE+'.csv'; a.click();
  };
  // ---- bulk downloads. The count comes BEFORE any download, and above a
  // threshold the download needs a second tap. Excel stops at 1,048,576 rows;
  // a phone browser struggles well before that.
  var EXCEL_MAX=1048576, HEAVY=300000;
  var tracked=[];
  function tradingDaysBetween(a,b){var n=0;for(var d=new Date(a+'T12:00:00Z');d<=new Date(b+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1)){var w=d.getUTCDay();if(w!==0&&w!==6)n++}return n}
  function sizeVerdict(rows){
    if(rows>EXCEL_MAX)return {cls:'bad',text:'<b>'+rows.toLocaleString()+' שורות</b> — יותר ממה ש-Excel יכול לפתוח ('+EXCEL_MAX.toLocaleString()+'). אפשר להוריד, אבל תצטרך כלי אחר לקרוא את זה.'};
    if(rows>HEAVY)return {cls:'warn',text:'<b>'+rows.toLocaleString()+' שורות</b> — כבד לטלפון. ההורדה עלולה להיות איטית או להיכשל.'};
    return {cls:'',text:'<b>'+rows.toLocaleString()+' שורות</b> — בסדר להורדה.'};
  }
  function fetchCsv(sym,from,to){
    var u='/bars/export/'+sym+(from?'?from='+from:'')+(to?(from?'&':'?')+'to='+to:'');
    return fetch(u,{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      var lines=t.split('\n'); return lines.slice(1).filter(Boolean);   // drop the header
    });
  }
  function saveCsv(name,lines){
    var blob=new Blob(['symbol,date,time,open,high,low,close,volume\n'+lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  }
  function progress(msg){var p=qs('#prog');p.hidden=!msg;p.textContent=msg||''}

  // one symbol, every day it has
  qs('#dlAll').onclick=function(){
    if(!SYM||!days.length){toast('אין ימים');return}
    var est=days.reduce(function(s,d){return s+(d.bars||0)},0);
    var v=sizeVerdict(est);
    if(!confirm(SYM+' · '+days.length+' ימים · '+v.text.replace(/<[^>]+>/g,'')+'\n\nלהוריד?'))return;
    progress('מוריד '+SYM+'…');
    fetchCsv(SYM,days[days.length-1].date,days[0].date).then(function(lines){
      progress(''); saveCsv(SYM+'_all_'+days[days.length-1].date+'_'+days[0].date+'.csv',lines);
      toast('הורדו '+lines.length.toLocaleString()+' שורות');
    },function(e){progress('');toast('נכשל: '+e)});
  };

  // every symbol, a date range
  qs('#dlRange').onclick=function(){
    var r=qs('#range'); r.hidden=!r.hidden; qs('#rEst').textContent=''; qs('#rEst').className='est';
    if(!qs('#rTo').value){var t=new Date();qs('#rTo').value=t.toISOString().slice(0,10);
      var f=new Date(t.getTime()-7*86400000);qs('#rFrom').value=f.toISOString().slice(0,10)}
    qs('#rGo').textContent='בדוק גודל'; qs('#rGo').dataset.ready='';
  };
  qs('#rCancel').onclick=function(){qs('#range').hidden=true};
  qs('#rGo').onclick=function(){
    var from=qs('#rFrom').value,to=qs('#rTo').value;
    if(!from||!to||from>to){toast('טווח תאריכים לא תקין');return}
    var syms=qs('#rTracked').checked?tracked:all;
    if(!syms.length){toast('אין סימבולים');return}
    var est=qs('#rEst'), go=qs('#rGo');
    // second tap: the count was shown and accepted
    if(go.dataset.ready==='1'){ return downloadRange(syms,from,to); }
    est.className='est'; est.textContent='בודק…';
    j('/bars/count?symbols='+syms.join(',')+'&from='+from+'&to='+to).then(function(c){
      var rows=c.estimate_total||0, v=sizeVerdict(rows);
      est.className='est '+v.cls;
      est.innerHTML=syms.length+' סימבולים · '+c.trading_days_in_range+' ימי מסחר בטווח<br>'+v.text+
        '<br><small>'+(c.d1_rows_exact?'מדויק מ-D1: '+c.d1_rows_exact.toLocaleString()+' · ':'')+'הערכה לארכיון: '+c.archive_rows_estimate.toLocaleString()+' (חסם עליון)</small>';
      go.textContent=rows>EXCEL_MAX?'הורד בכל זאת':'הורד עכשיו'; go.dataset.ready='1';
    },function(e){est.className='est bad';est.textContent='לא הצלחתי לספור: '+e});
  };
  function downloadRange(syms,from,to){
    var acc=[], i=0, failed=[];
    qs('#rGo').disabled=true;
    var step=function(){
      if(i>=syms.length){
        qs('#rGo').disabled=false; progress('');
        if(!acc.length){toast('לא נמצאו נרות בטווח');return}
        saveCsv('all_'+from+'_'+to+'.csv',acc);
        toast('הורדו '+acc.length.toLocaleString()+' שורות מ-'+(syms.length-failed.length)+' סימבולים'+(failed.length?' · נכשלו: '+failed.join(','):''));
        return;
      }
      var s=syms[i++];
      progress('מוריד '+s+' ('+i+'/'+syms.length+') · '+acc.length.toLocaleString()+' שורות עד כה');
      fetchCsv(s,from,to).then(function(lines){lines.forEach(function(l){acc.push(l)});step()},function(){failed.push(s);step()});
    };
    step();
  }

  // ---- daily prices: one row per symbol per day -------------------------
  var dRows=[];
  // Sorting is a VIEW over the loaded rows: the fetch is untouched, so a sort
  // never costs a request and never changes what was loaded.
  var dSort='date', dDir=-1;
  var DCOL={
    symbol:{t:'סימבול',v:function(r){return r.symbol}},
    date:{t:'תאריך',v:function(r){return r.date}},
    open:{t:'פתיחה',v:function(r){return r.open}},
    high:{t:'גבוה',v:function(r){return r.high}},
    low:{t:'נמוך',v:function(r){return r.low}},
    close:{t:'סגירה',v:function(r){return r.close}},
    chg:{t:'שינוי',v:function(r){return (r.open!=null&&r.close!=null)?(r.close-r.open)/r.open*100:null}},
    volume:{t:'נפח',v:function(r){return r.volume}},
    bars:{t:'נרות',v:function(r){return r.bars||0}},
    pclose:{t:'',v:function(r){return null}},gap:{t:'',v:function(r){return null}}
  };
  function sortedDaily(){
    var col=DCOL[dSort]; if(!col)return dRows.slice();
    return dRows.slice().sort(function(a,b){
      var x=col.v(a), y=col.v(b);
      // Missing values sink to the bottom in either direction. A null is not a
      // small number, and sorting by change should not put unknowns on top.
      if(x==null&&y==null)return 0;
      if(x==null)return 1;
      if(y==null)return -1;
      if(typeof x==='number'&&typeof y==='number')return (x-y)*dDir;
      return String(x).localeCompare(String(y))*dDir;
    });
  }
  function th(key){
    var on=dSort===key;
    return '<th class="s'+(on?' on':'')+'" data-c="'+key+'">'+DCOL[key].t+
      (on?'<span class="ar">'+(dDir<0?'▼':'▲')+'</span>':'')+'</th>';
  }
  function switchTab(daily){
    qs('#tabDay').className='tab'+(daily?'':' on');
    qs('#tabDaily').className='tab'+(daily?' on':'');
    ['#pickMin','#days','#sum','#tbl'].forEach(function(s){var e=qs(s);if(e)e.hidden=daily});
    document.querySelectorAll('.acts')[0].hidden=daily;
    qs('#pickDaily').hidden=!daily;
    qs('#dailyWrap').hidden=!daily;
  }
  qs('#tabDay').onclick=function(){switchTab(false)};
  qs('#tabDaily').onclick=function(){
    switchTab(true);
    if(!dRows.length)loadDaily();
  };
  function loadDaily(){
    var q=[], s=(qs('#dSym').value||'').trim().toUpperCase(), f='', t='';
    var mode=qs('#dRange').value;
    if(mode==='x'){ f=qs('#dFrom').value; t=qs('#dTo').value; }
    else if(mode!=='0'){
      // "last N days" is a window ending today, not a fixed calendar month.
      var now=new Date();
      t=now.toISOString().slice(0,10);
      f=new Date(now.getTime()-parseInt(mode,10)*86400000).toISOString().slice(0,10);
    }
    if(s)q.push('symbols='+s);
    if(f)q.push('from='+f);
    if(t)q.push('to='+t);
    qs('#dTbl').innerHTML='<div class="msg">טוען…</div>';
    return j('/bars/daily'+(q.length?'?'+q.join('&'):'')).then(function(d){
      dRows=d.rows||[]; drawDaily();
    },function(e){qs('#dTbl').innerHTML='<div class="msg">שגיאה: '+e+'</div>'});
  }
  function drawDaily(){
    if(!dRows.length){qs('#dTbl').innerHTML='<div class="msg"><b>אין נתונים בטווח</b></div>';qs('#dCount').textContent='';return}
    var syms={}; dRows.forEach(function(r){syms[r.symbol]=1});
    qs('#dCount').textContent=dRows.length+' שורות · '+Object.keys(syms).length+' סימבולים';
    var h='<table><thead><tr>'+
      ['symbol','date','open','high','low','close','chg','volume','bars'].map(th).join('')+
      '</tr></thead><tbody>';
    sortedDaily().forEach(function(r){
      var chg=(r.open!=null&&r.close!=null)?(r.close-r.open)/r.open*100:null;
      // A day we did not collect in full is marked: its open, high, low and
      // volume describe the minutes we have, not the session.
      var part=r.source==='minutes'&&r.complete===false;
      h+='<tr class="'+(part?'part':'')+'">'+
        '<td>'+r.symbol+'</td>'+
        '<td>'+r.date+'</td>'+
        '<td>'+(r.open!=null?r.open.toFixed(2):'—')+'</td>'+
        '<td>'+(r.high!=null?r.high.toFixed(2):'—')+'</td>'+
        '<td>'+(r.low!=null?r.low.toFixed(2):'—')+'</td>'+
        '<td class="p">'+(r.close!=null?r.close.toFixed(2):'—')+'</td>'+
        '<td class="'+(chg>0?'pos':chg<0?'neg':'')+'">'+(chg==null?'—':(chg>=0?'+':'')+chg.toFixed(2)+'%')+'</td>'+
        '<td>'+(r.volume!=null?fmtK(r.volume):'—')+'</td>'+
        '<td>'+(r.bars||0)+(part?' ✗':'')+'</td>'+
        '</tr>';
    });
    qs('#dTbl').innerHTML=h+'</tbody></table>'+
      '<div style="padding:9px 12px;font-size:11.5px;color:var(--muted);line-height:1.6">'+
      'שורה צהובה = יום חלקי: המספרים מתארים את הדקות שנאספו ולא את כל הסשן.<br>'+
      'לחיצה על כותרת ממיינת; לחיצה שנייה הופכת כיוון. גוללים ימינה־שמאלה לראות את שאר העמודות.</div>';
    var head=qs('#dTbl').querySelector('thead');
    if(head)head.onclick=function(e){
      var c=e.target.closest('.s'); if(!c)return;
      var k=c.dataset.c;
      // Same column flips direction; a new column starts descending for numbers
      // and ascending for text, which is what each is normally wanted as.
      if(dSort===k)dDir=-dDir;
      else {dSort=k;dDir=(k==='symbol'||k==='date')?(k==='date'?-1:1):-1}
      drawDaily();
    };
  }
  function dailyCsv(){
    return ['symbol,date,open,high,low,close,volume,bars'].concat(dRows.map(function(r){
      return [r.symbol,r.date,r.open,r.high,r.low,r.close,r.volume,r.bars].join(',');
    })).join('\n');
  }
  qs('#dGo').onclick=loadDaily;
  qs('#dSym').onchange=loadDaily;
  qs('#dRange').onchange=function(){
    var exact=this.value==='x';
    qs('#dExact').hidden=!exact;
    if(exact){
      if(!qs('#dTo').value){var n=new Date();qs('#dTo').value=n.toISOString().slice(0,10);
        qs('#dFrom').value=new Date(n.getTime()-30*86400000).toISOString().slice(0,10)}
      return;   // wait for הצג, so a half-typed range never fires a query
    }
    loadDaily();
  };
  qs('#dCopy').onclick=function(){
    if(!dRows.length)return; var t=dailyCsv();
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
      .then(function(){toast('הועתקו '+dRows.length+' שורות')},function(){prompt('העתק:',t)});
  };
  qs('#dDl').onclick=function(){
    if(!dRows.length)return;
    var b=new Blob([dailyCsv()],{type:'text/csv'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='daily_'+(qs('#dFrom').value||'all')+'_'+(qs('#dTo').value||'all')+'.csv'; a.click();
  };

  loadIndex().catch(function(e){qs('#tbl').innerHTML='<div class="msg"><b>לא הצלחתי לטעון.</b><br>'+String(e)+'</div>'});
})();
</script>
</body>
</html>
