<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trader V2 — Experimental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* The production Radar stylesheet, copied verbatim so the page is visually the
   same product. Nothing here is redesigned; only the data feeding it changes. */

  :root{
    --paper:#F2F4F7; --ink:#1B2430; --muted:#5B6673; --rule:#D6DBE2; --well:#FFFFFF;
    --up:#0F766E; --down:#B42318; --flat:#8A94A0;
    --s-quiet:#8A94A0; --s-watch:#B7791F; --s-close:#C2410C; --s-ready:#0F766E; --s-active:#1D4ED8; --s-avoid:#B42318; --s-none:#98A2B3;
  }
  *{box-sizing:border-box}
  /* A display rule beats the hidden ATTRIBUTE; without this, hiding an element
     styled display:flex silently does nothing. */
  [hidden]{display:none!important}
  /* THE root cause of the clipped card. Nothing stopped the PAGE from becoming
     wider than the screen, and a mobile browser then widens the whole layout
     viewport to fit it. A position:fixed overlay is placed against that widened
     viewport, so the card appeared shifted and cut at the edge while the list
     showed through beside it — and every fix inside the card was powerless,
     because the card was not the thing overflowing. */
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
    max-width:100%;overflow-x:hidden}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .num{direction:ltr;unicode-bidi:isolate}
  button,select{font:inherit}
  button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
  .hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
  .hrow h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.01em}
  .spacer{flex:1}
  .build{font-size:10px;color:var(--muted);direction:ltr;unicode-bidi:isolate;opacity:.8}
  .audit{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;cursor:pointer}
  .audit[hidden]{display:none}
  .audit.ok{background:#D7EFEC;color:var(--up)}
  .audit.warn{background:#FBEED0;color:#8A5B12}
  .audit.bad{background:#F6DAD6;color:var(--down)}
  .auditbox{margin:6px 10px;padding:10px 12px;background:var(--well);border:1px solid var(--rule);border-radius:11px;font-size:12.5px;line-height:1.55}
  .auditbox[hidden]{display:none}
  .auditbox b{font-weight:800}
  .auditbox .f{padding:5px 0;border-top:1px solid var(--rule)}
  .auditbox .f:first-of-type{border-top:none}
  .mini-btn{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink)}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;font-size:12.5px;color:var(--muted);scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip b{color:var(--ink);font-weight:600}
  .strip .chip{background:var(--well);border:1px solid var(--rule);border-radius:8px;padding:4px 9px;white-space:nowrap}
  .strip .chip.up b{color:var(--up)} .strip .chip.down b{color:var(--down)}
  .counts{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .counts::-webkit-scrollbar{display:none}
  .cnt{border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;border:none}
  .cnt[data-on="0"]{opacity:.35}
  .cnt.sel{outline:2px solid var(--ink);outline-offset:1px}
  .ctrl{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-size:13px;color:var(--muted)}
  .ctrl select{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 9px;font-size:13px;color:var(--ink)}

  .rows{padding:6px 10px 0}
  .row{display:grid;grid-template-columns:60px 1fr 74px;gap:8px 10px;background:var(--well);border:1px solid var(--rule);border-left:4px solid var(--s-none);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;align-items:center}
  .row:active{transform:scale(.995)}
  .row .sym{font-weight:800;font-size:16px;letter-spacing:.02em}
  .row .px{font-size:13px;color:var(--muted);font-weight:600}
  .row .mid{min-width:0}
  .row .st{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.03em}
  .row .why{font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .row .meta b{color:var(--ink);font-weight:600}
  .row .rt{text-align:left}
  .row .score{font-size:20px;font-weight:800;line-height:1}
  .row .score small{font-size:11px;font-weight:600;color:var(--muted)}
  .row svg{display:block;width:74px;height:26px;margin-top:4px}
  .row.stale{opacity:.6}
  .QUIET{border-left-color:var(--s-quiet)} .WATCH{border-left-color:var(--s-watch)} .CLOSE{border-left-color:var(--s-close)}
  .READY{border-left-color:var(--s-ready)} .ACTIVE{border-left-color:var(--s-active)} .AVOID{border-left-color:var(--s-avoid)}
  .bg-QUIET{background:var(--s-quiet)} .bg-WATCH{background:var(--s-watch)} .bg-CLOSE{background:var(--s-close)}
  .bg-READY{background:var(--s-ready)} .bg-ACTIVE{background:var(--s-active)} .bg-AVOID{background:var(--s-avoid)} .bg-NODATA{background:var(--s-none)}
  .spark .line{fill:none;stroke:var(--ink);stroke-width:1.2}
  .spark .lvl{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 2}
  .spark .sup{stroke:var(--up)} .spark .res{stroke:var(--down)}
  .spark .dot{fill:var(--ink)}

  .sheet{position:fixed;inset:0;z-index:40;background:rgba(20,26,34,.62);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  /* min-width:0 — a flex item will not shrink below its content without it, so
     width:100% is not enough: content wider than the screen pushes the whole
     panel sideways and everything inside is cut at the edge. This only ENABLES
     shrinking; content that already fits is unaffected. */
  .panel{background:var(--paper);width:100%;min-width:0;max-width:100vw;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .grab{width:38px;height:4px;background:var(--rule);border-radius:2px;margin:8px auto 0}
  .phead{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
  .phead .s{font-size:22px;font-weight:800} .phead .p{font-size:22px;font-weight:800}
  .phead .chg{font-size:14px;font-weight:600}
  .phead .chg.up{color:var(--up)} .phead .chg.down{color:var(--down)}
  .pstat{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap}
  .pstat .st{font-size:13px;font-weight:800;color:#fff;border-radius:7px;padding:4px 10px}
  .pstat .sc{font-size:13px;color:var(--muted)} .pstat .sc b{font-size:18px;color:var(--ink)}
  .pstat .fr{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .pstat .fr i{width:8px;height:8px;border-radius:50%;background:var(--flat)}
  .fr.LIVE i{background:var(--up)} .fr.DELAYED i{background:var(--s-watch)} .fr.STALE i{background:var(--down)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
  .card{background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:9px 11px}
  .card small{display:block;font-size:11.5px;color:var(--muted)} .card b{font-size:17px;font-weight:800}
  .card span{font-size:11.5px;color:var(--muted)}
  .lvls{padding:12px 16px 0}
  .lvls .l{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
  .lvls .l span:first-child{color:var(--muted);font-size:12px} .lvls .l b{font-weight:700} .lvls .l i{font-style:normal;font-size:11.5px;color:var(--muted)}
  .bar{margin:14px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:14px 12px 10px}
  .bar svg{display:block;width:100%;height:56px}
  .bar .t{fill:var(--muted);font-size:9.5px} .bar .now{fill:var(--ink);font-size:10.5px;font-weight:700}
  .sec{padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
  .sec b{color:var(--ink);font-weight:600}
  .acts{display:flex;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
  .acts button{background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600}
  .acts .ghost{background:var(--well);color:var(--ink);border:1px solid var(--rule)}
  .menu{margin:8px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .menu[hidden]{display:none}
  .menu button{display:block;width:100%;text-align:right;background:none;border:none;border-bottom:1px solid var(--rule);padding:11px 14px;font-size:14px;color:var(--ink)}
  .menu button:last-child{border-bottom:none}
  .menu button small{color:var(--muted);font-size:12px;margin-right:6px}
  .feed{margin-top:14px;border-top:1px solid var(--rule)}
  .fmodes{display:flex;gap:6px;padding:10px 16px}
  .fmodes button{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
  .fmodes button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ev{display:grid;grid-template-columns:48px 1fr auto;gap:8px;padding:9px 16px;border-bottom:1px solid var(--rule);font-size:13.5px;align-items:baseline;border-right:3px solid transparent}
  .ev .t{color:var(--muted);font-size:12.5px}
  .ev.g{border-right-color:var(--up)} .ev.r{border-right-color:var(--down)} .ev.o{border-right-color:var(--s-close)}
  .ev.y{border-right-color:var(--s-watch)} .ev.b{border-right-color:var(--s-active)} .ev.n{border-right-color:var(--rule)}
  .empty{padding:22px 16px;text-align:center;color:var(--muted);line-height:1.6}
  /* Buy decision card — styles scoped to .buycard so nothing outside it moves.
     Every other block in the panel supplies its own 16px side padding; this one
     did not, so its text ran to the very edge and read as though it were
     floating over the radar behind it. */
  .buycard{padding:14px 16px 16px;background:var(--paper);max-width:100%;overflow-x:hidden;box-sizing:border-box}
  .buycard *{min-width:0;max-width:100%;box-sizing:border-box}
  .bchead{font-size:15px;font-weight:600;color:var(--muted)}
  .bchead b{font-size:24px;font-weight:800;color:var(--ink);display:block;margin-bottom:1px}
  .bcsub{font-size:12.5px;color:var(--muted);margin-top:2px;direction:ltr;unicode-bidi:isolate;text-align:right}
  .bcverdict{margin:14px 0 10px;padding:18px 12px;border-radius:14px;font-size:20px;font-weight:800;text-align:center;line-height:1.3}
  .bcverdict.buy{background:#D7EFEC;color:var(--up)}
  .bcverdict.wait{background:#F6DAD6;color:var(--down)}
  .bcverdict.recheck{background:#FBEED0;color:#8A5B12}
  .bcverdict.nosetup{background:var(--rule);color:var(--muted)}
  .bcblock{font-size:12.5px;color:var(--down);text-align:center;margin-bottom:6px}
  .bcmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:2px 0 2px;
    padding:10px 12px;background:var(--well);border:1px solid var(--rule);border-radius:10px}
  .bcmeta b{color:var(--ink)}
  .bcsec{font-size:11.5px;font-weight:800;color:var(--muted);margin:16px 0 7px;letter-spacing:.04em}
  .bcmap{border:1px solid var(--rule);border-radius:11px;overflow:hidden}
  .bcrow{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);align-items:center;gap:10px;
    padding:10px 12px;border-top:1px solid var(--rule);font-size:13.5px}
  .bcrow .bcd{text-align:left}
  .bcrow:first-child{border-top:none}
  .bcrow .bcr{font-weight:800;direction:ltr;unicode-bidi:isolate}
  .bcrow.buy{background:#EAF7F5} .bcrow.wait{background:#FCEFED}
  .bcrow.recheck{background:#FDF6E6} .bcrow.nosetup{background:var(--well)}
  .bcvalid{margin-top:10px;padding:10px 12px;background:var(--well);border:1px solid var(--rule);border-radius:11px;font-size:13px;font-weight:700}
  .bcvalid small{display:block;font-weight:400;color:var(--muted);margin-top:5px;line-height:1.5}
  .bcwhy{font-size:13.5px;line-height:1.6;padding:10px 12px;background:var(--well);
    border:1px solid var(--rule);border-radius:10px}
  /* A grid, not space-between. space-between pushes the value to the far edge,
     and when the panel is wider than the screen that edge is off-screen: the
     labels stayed visible while PULLBACK was cut to BACK and the EMA pair to
     "7 / 616.79". A two-column grid keeps both parts inside the card. */
  .bctech{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:7px 12px;font-size:13px;
    color:var(--muted);padding:11px 12px;background:var(--well);border:1px solid var(--rule);border-radius:10px}
  .bctech span{display:contents}
  .bctech span>b{text-align:left;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;color:var(--ink)}
  .bctech b{color:var(--ink)}
  .bcnote{font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:8px;border-top:1px solid var(--rule)}
  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60}
  .toast[hidden]{display:none}

  .plan{margin:12px 16px 0;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px}
  .plan .act{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .plan .act b{font-size:26px;font-weight:800}
  .plan .act .st2{font-size:12px;font-weight:700;opacity:.75;letter-spacing:.04em}
  .plan .hl{font-size:13px;opacity:.8;margin-top:2px}
  .plan .wait{margin-top:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
  .plan .wait small{display:block;font-size:11.5px;opacity:.75} .plan .wait b{font-size:22px;font-weight:800}
  .plan .steps{margin-top:10px;display:grid;gap:5px;font-size:13px}
  .plan .steps div{display:grid;grid-template-columns:76px 1fr;gap:8px}
  .plan .steps span{opacity:.7;font-size:12px}
  .plan.FAILED .act b,.plan.DO_NOT_CHASE .act b{color:#FCA5A5}
  .plan.READY_PARTIAL .act b,.plan.READY_ADD .act b{color:#5EEAD4}
  .plan.ACTIVE .act b,.plan.TAKE_PROFIT_AREA .act b{color:#93C5FD}
  /* Alerts sit in a narrow column at the side and never span the screen, so
     they cannot cover the rows or the decision block underneath. */
  .frozen{padding:11px 16px;background:#F6DAD6;border-bottom:1px solid #E4B4AD;font-size:12.5px;line-height:1.6}
  .frozen b{display:block;color:var(--down);font-size:13.5px;margin-bottom:3px}
  .frozen div{color:var(--muted)}
  .alerts{position:fixed;top:auto;bottom:12px;right:8px;left:auto;z-index:70;display:flex;flex-direction:column;
    gap:6px;pointer-events:none;width:min(260px,62vw);max-height:46vh;overflow:hidden}
  .al{background:var(--well);border:1px solid var(--rule);border-right:5px solid var(--s-active);border-radius:11px;
    padding:7px 10px;box-shadow:0 4px 14px rgba(20,26,34,.14);pointer-events:auto;font-size:12.5px;opacity:.97}
  .al.high{border-right-color:var(--s-ready)} .al.bad{border-right-color:var(--s-avoid)} .al.med{border-right-color:var(--s-close)}
  .al b{font-size:13.5px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .al div{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .al .x{position:absolute;inset-inline-start:6px;top:5px;color:var(--muted);font-size:14px;line-height:1;padding:2px 5px}
  .al{position:relative;padding-inline-start:26px}
  .log2{margin:0 16px;background:var(--well);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .log2[hidden]{display:none}
  .log2 button{display:block;width:100%;text-align:right;background:none;border:none;border-bottom:1px solid var(--rule);padding:9px 12px;font-size:13px;color:var(--ink)}
  .log2 button:last-child{border-bottom:none}
  .log2 small{color:var(--muted);margin-left:6px}
  .range{margin:8px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:12px}
  .range[hidden]{display:none}
  .range label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
  .range .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .range select{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:8px;font-size:13px}
  .range .sum{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5}
  .range .go{margin-top:9px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
  .sess{background:var(--s-avoid);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:5px}
  .sess[hidden]{display:none}

  .wn{margin:12px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
  .wn .top2{padding:14px;background:var(--ink);color:var(--paper)}
  .wn .top2 .a{font-size:27px;font-weight:800;line-height:1.15}
  .wn .top2 .n{font-size:14px;margin-top:6px;opacity:.9;line-height:1.5}
  .wn .scen{font-size:11.5px;opacity:.75;margin-top:6px;letter-spacing:.02em}
  .wn.WATCH_ONLY .top2 .a{color:#CBD5E1}
  .wn.ENTRY_AVAILABLE .top2 .a{color:#5EEAD4} .wn.SETUP_CANCELLED .top2 .a,.wn.EXIT .top2 .a{color:#FCA5A5}
  .wn.TAKE_PARTIAL .top2 .a,.wn.HOLD .top2 .a{color:#93C5FD} .wn.SESSION_CLOSED .top2 .a{color:#FDE68A}
  .odds{padding:12px 14px 0}
  .odds .bar2{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
  .odds .u{background:var(--up);display:flex;align-items:center;justify-content:center}
  .odds .d{background:var(--down);display:flex;align-items:center;justify-content:center}
  .odds .q{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .odds .q b{color:var(--ink)}
  .paths{padding:12px 14px 4px;display:grid;gap:10px}
  .pth{border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.65}
  .pth.u{background:#E6F4F1} .pth.d{background:#FBEAE7}
  .pth h4{margin:0 0 4px;font-size:12.5px;font-weight:800;color:var(--muted)}
  .pth div{margin-top:2px}
  .wn .why2{padding:10px 14px 14px;font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--rule)}
  details.raw{margin:12px 16px 0}
  details.raw>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 0}

  .flow{padding:12px 14px 0}
  .flow .fb{display:flex;height:22px;border-radius:7px;overflow:hidden;font-size:11.5px;font-weight:700;color:#fff}
  .flow .fb .b{background:var(--up);display:flex;align-items:center;justify-content:center}
  .flow .fb .s{background:var(--down);display:flex;align-items:center;justify-content:center}
  .flow .ft{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .flow .ft b{color:var(--ink)}
  .book{padding:10px 14px 0}
  .book .bb{display:flex;height:20px;border-radius:7px;overflow:hidden;font-size:11px;font-weight:700;color:#fff}
  .book .bb .b{background:var(--up);display:flex;align-items:center;justify-content:center}
  .book .bb .a{background:var(--down);display:flex;align-items:center;justify-content:center}
  .book .lv3{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 10px;margin-top:8px;font-size:12px;direction:ltr}
  .book .lv3 .h{color:var(--muted);font-size:11px;font-weight:600}
  .book .lv3 .bq{text-align:right;color:var(--up)} .book .lv3 .aq{text-align:left;color:var(--down)}
  .book .lv3 .px2{text-align:center;font-weight:600}
  .book .meta2{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.55}
  .book .warn{font-size:11px;color:var(--muted);opacity:.9;margin-top:4px}
  .flow .src{font-size:11px;color:var(--muted);opacity:.85;margin-top:4px}
  .row .fl{font-size:11px;margin-top:2px}
  .row .fl b{font-weight:700}
  .row .fl .up{color:var(--up)} .row .fl .dn{color:var(--down)}
  @media(min-width:720px){
    .alerts{width:300px;bottom:16px;right:16px}
    .row{grid-template-columns:80px 1fr 120px 90px}
    .rows{max-width:900px;margin:0 auto}
    .panel{max-width:720px;margin:0 auto;border-radius:18px;max-height:88vh}
    .sheet{align-items:center}
  }

/* the only additions: a frozen-engine strip and the BUY/ACTIVE detail block,
   built from the same tokens the Radar already uses */
.frozen2{background:#EEF1F5;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:5px 16px;font-size:11px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.exp2{font-size:10px;font-weight:800;background:var(--s-avoid);color:#fff;border-radius:6px;padding:2px 7px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:5px 9px;margin-top:7px;
  padding:8px 9px;background:var(--paper);border-radius:8px;font-size:11.5px;color:var(--muted)}
.plan b{display:block;color:var(--ink);font-size:13px;direction:ltr;unicode-bidi:isolate}
.act{margin-top:7px;display:flex;gap:7px}
.act button{font:inherit;font-size:12.5px;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;background:var(--well);color:var(--ink)}
.act button.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.row.READY{border-color:var(--s-ready);border-width:2px}
.row.ACTIVE{border-color:var(--s-active);border-width:2px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>TRADER V2 — EXPERIMENTAL</h1><span class="exp2">אינו מבצע פקודות</span>
    <div class="spacer"></div>
    <span id="clock" style="font-size:12px;color:var(--muted)"></span>
    <button class="mini-btn" id="reload" type="button">רענן</button>
    <span class="build" title="גרסת העמוד"><!--BUILD--></span>
  </div>
  <div class="counts" id="counts"></div>
  <div class="ctrl">
    <span>מיון</span>
    <select id="sort">
      <option value="attention" selected>תשומת לב</option>
      <option value="score">ציון Setup</option>
      <option value="distance">מרחק לטריגר</option>
      <option value="age">בשלות סטאפ</option>
      <option value="symbol">סימבול</option>
    </select>
    <div class="spacer"></div>
    <select id="every" aria-label="רענון אוטומטי">
      <option value="0">רענון: כבוי</option>
      <option value="15">15 שנ׳</option>
      <option value="30">30 שנ׳</option>
      <option value="60" selected>60 שנ׳</option>
    </select>
    <label class="mini-btn" style="display:flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" id="cmpOn" checked> Production</label>
    <a class="mini-btn" href="/radar" style="text-decoration:none">Radar ייצור</a>
    <button class="mini-btn" id="alertsBtn" type="button">🔔</button>
    <span id="prog"></span>
  </div>
  <div class="frozen2">Trader V2 v192 · engine FROZEN · every decision on this page comes from the validated v192 engine</div>
</header>

<div class="rows" id="rows"><div class="empty">לחץ "התחל" — היקום ייטען, וכל נר דקה שנסגר יעדכן את השורות.</div></div>

<div class="toast" id="toast" hidden></div>
<div class="alert" id="alertBox" hidden><div class="box">
  <h3 id="alertTitle"></h3><div id="alertBody" style="font-size:14px;line-height:1.7;color:var(--muted)"></div>
  <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
    <button type="button" id="alertOk" class="mini-btn">הבנתי</button></div>
</div></div>

<script>
<!--V2ENGINE-->
</script>
<script>
(function(){
  var qs=function(s){return document.querySelector(s)};
  function on(sel,evt,fn){var e=qs(sel);if(!e)return;e.addEventListener(evt,fn)}
  function j(u){return fetch(u+(u.indexOf('?')>0?'&':'?')+'ts='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
  function toast(m){var t=qs('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2200)}
  function n2(v){return v==null||isNaN(v)?'—':(+v).toFixed(2)}
  function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'})}

  // The Radar's own status vocabulary, reused so the badges read the same.
  // V2 maps onto it: READY is BUY NOW, CLOSE is VERY CLOSE, AVOID is NO TRADE.
  var STATUS_TXT={QUIET:'שקט',WATCH:'מעקב',CLOSE:'קרוב מאוד',READY:'BUY NOW',ACTIVE:'פעיל',AVOID:'לא נכנסים','NO DATA':'אין נתונים'};
  var TRADED='RECLAIM_CONTINUATION';
  var symbols=[], store={}, timer=null, filterStatus=null, positions={}, consumed={}, lastSig={}, alertsOn=true;
  var decisions=[], transitions=[];

  // ---- V2 decision. Production status never enters this function.
  function evaluate(sym,rows){
    if(rows.length<16)return null;
    var st=runV2(rows,{computeBars:computeBars,decide:decide},{});
    var s=st[st.length-1]; if(!s)return null;
    var bars=computeBars(rows), b=bars[bars.length-1], atr=b.atr||0.01;
    var tradable=s.setup&&s.setup.type===TRADED;
    var ext=s.plan?(b.close-s.plan.entry)/atr:null;
    var pos=positions[sym], spent=s.setupId&&consumed[s.setupId];
    var need=(s.waiting&&s.waiting.stillRequired)||[];
    var onlyTrig=need.length===1&&/פריצה|סגירה קרוב/.test(need[0]);
    var nearPct=s.plan?(s.plan.entry-b.close)/s.plan.entry*100:null;
    var status,why;
    if(pos&&s.setupId===pos.setupId){status='ACTIVE';why='בפוזיציה מ-'+pos.at+' · כניסה '+n2(pos.entry);}
    else if(spent){status='AVOID';why='הסטאפ כבר מוצה — אין כניסה חוזרת';}
    else if(s.state==='READY'&&tradable){status='READY';why=s.reason||'התנאים התקיימו';}
    else if(s.state==='FAILED'){status='AVOID';why='הסטאפ בוטל — '+(s.reason||'המבנה נשבר');}
    else if(s.state==='AVOID'){status='AVOID';why=s.reason||'לא מועמד';}
    else if(s.state==='READY'&&!tradable){status='AVOID';why='משפחת צל '+s.setup.type+' — לא נסחרת';}
    else if(tradable&&ext!=null&&ext>CFG.chaseATR){status='AVOID';why='מורחב '+ext.toFixed(2)+' ATR מעל הטריגר '+n2(s.plan.entry)+' — לא רודפים';}
    else if(tradable&&onlyTrig&&nearPct!=null&&nearPct>=0&&nearPct<=0.15){
      status='CLOSE';why=nearPct.toFixed(2)+'% מתחת לטריגר '+n2(s.plan.entry)+' · כרגע '+n2(b.close);}
    else if(need.length){status='WATCH';why=need.join(' · ');}
    else {status='QUIET';why=s.next||s.reason||'אין סטאפ פעיל';}
    return {symbol:sym,time:s.time,price:b.close,open:rows[0].open,status:status,why:why,
      engineState:s.state,family:s.setup?s.setup.type:'',setupId:s.setupId||'',age:s.setupAgeBars,
      score:s.score==null?0:s.score,quality:s.quality?s.quality.label:'',structure:s.trend||'—',
      volx:b.relVol,ext:ext,plan:s.plan||null,waiting:need,reason:s.reason||'',next:s.next||'',
      pos:pos||null,closes:bars.slice(-48).map(function(x){return x.close})};
  }

  // ---- the Radar's own sparkline shape
  function spark(r){
    var cl=r.closes; if(!cl||cl.length<2)return '';
    var lo=Math.min.apply(null,cl),hi=Math.max.apply(null,cl),rg=(hi-lo)||1;
    var pts=cl.map(function(c,i){return (i/(cl.length-1)*64).toFixed(1)+','+(24-(c-lo)/rg*22).toFixed(1)}).join(' ');
    return '<svg width="64" height="26" viewBox="0 0 64 26" style="margin-top:5px"><polyline points="'+pts+
      '" fill="none" stroke="'+(cl[cl.length-1]>=cl[0]?'var(--up)':'var(--down)')+'" stroke-width="1.4"/></svg>';
  }

  var RANK={READY:0,ACTIVE:1,CLOSE:2,WATCH:3,QUIET:4,AVOID:5};
  var QRANK={Strong:0,Good:1,Neutral:2,Weak:3,Avoid:4};
  function sortRadar(rows,mode){
    return rows.slice().sort(function(a,b){
      if(mode==='symbol')return a.symbol<b.symbol?-1:1;
      if(mode==='score')return b.score-a.score;
      if(mode==='distance')return Math.abs(a.ext==null?99:a.ext)-Math.abs(b.ext==null?99:b.ext);
      if(mode==='age')return (b.age||0)-(a.age||0);
      if(RANK[a.status]!==RANK[b.status])return RANK[a.status]-RANK[b.status];
      var qa=QRANK[a.quality]==null?9:QRANK[a.quality],qb=QRANK[b.quality]==null?9:QRANK[b.quality];
      if(qa!==qb)return qa-qb;
      return b.score-a.score;
    });
  }

  function drawHead(rows){
    var c={};rows.forEach(function(r){c[r.status]=(c[r.status]||0)+1});
    var order=['READY','ACTIVE','CLOSE','WATCH','QUIET','AVOID'];
    qs('#counts').innerHTML=order.map(function(k){
      return '<div class="cnt'+(filterStatus===k?' on':'')+'" data-f="'+k+'"><span class="dot bg-'+k+'"></span>'+
        STATUS_TXT[k]+' <b>'+(c[k]||0)+'</b></div>';}).join('');
    [].forEach.call(document.querySelectorAll('.cnt'),function(el){
      el.onclick=function(){filterStatus=filterStatus===el.dataset.f?null:el.dataset.f;render()};});
  }

  function render(){
    var rows=symbols.map(function(s){return store[s]}).filter(Boolean);
    drawHead(rows);
    var list=sortRadar(rows,qs('#sort').value);
    if(filterStatus)list=list.filter(function(r){return r.status===filterStatus});
    if(!list.length){qs('#rows').innerHTML='<div class="empty">אין מניות להצגה.</div>';return}
    qs('#rows').innerHTML=list.map(function(r){
      // the production Radar's three-column row, unchanged in shape
      var extra='';
      if(r.status==='READY'&&r.plan){
        var risk=r.price-r.plan.stop, execR=(r.plan.t1-r.price)/risk;
        extra='<div class="plan">'+
          '<span>טריגר<b>$'+n2(r.plan.entry)+'</b></span>'+
          '<span>ביצוע<b>$'+n2(r.price)+'</b></span>'+
          '<span>סטופ<b>$'+n2(r.plan.stop)+'</b></span>'+
          '<span>סיכון/מניה<b>$'+n2(risk)+'</b></span>'+
          '<span>T1<b>$'+n2(r.plan.t1)+'</b></span>'+
          '<span>T2<b>$'+n2(r.plan.t2)+'</b></span>'+
          '<span>R:R תוכנית<b>'+n2(r.plan.rr)+'</b></span>'+
          '<span>R:R בפועל<b>'+n2(execR)+'</b></span>'+
          '<span>מרדף<b>'+n2(r.ext)+' ATR</b></span>'+
          '<span>ביטול<b>$'+n2(r.plan.invalidation)+'</b></span>'+
          '<span>גיל<b>'+r.age+' נרות</b></span></div>'+
          '<div class="act"><button type="button" class="dark takeBtn" data-s="'+r.symbol+'">נכנסתי</button></div>';
      } else if(r.status==='ACTIVE'&&r.pos){
        var liveR=(r.price-r.pos.entry)/(r.pos.entry-r.pos.stop);
        extra='<div class="plan">'+
          '<span>כניסה<b>$'+n2(r.pos.entry)+'</b></span>'+
          '<span>כרגע<b>$'+n2(r.price)+'</b></span>'+
          '<span>R חי<b>'+(liveR>=0?'+':'')+n2(liveR)+'R</b></span>'+
          '<span>סטופ<b>$'+n2(r.pos.stop)+'</b></span>'+
          '<span>לסטופ<b>$'+n2(r.price-r.pos.stop)+'</b></span>'+
          '<span>T1<b>$'+n2(r.pos.t1)+'</b></span>'+
          '<span>ל-T1<b>$'+n2(r.pos.t1-r.price)+'</b></span>'+
          '<span>T2<b>$'+n2(r.pos.t2)+'</b></span></div>'+
          '<div class="act"><button type="button" class="closeBtn" data-s="'+r.symbol+'">יצאתי</button></div>';
      } else if(r.plan&&(r.status==='CLOSE'||r.status==='WATCH')){
        extra='<div class="meta"><span>טריגר <b class="num">'+n2(r.plan.entry)+'</b></span>'+
          '<span>סטופ <b class="num">'+n2(r.plan.stop)+'</b></span>'+
          '<span>ביטול <b class="num">'+n2(r.plan.invalidation)+'</b></span></div>';
      }
      return '<div class="row '+r.status+'" data-s="'+r.symbol+'" tabindex="0" role="button">'+
        '<div><div class="sym">'+r.symbol+'</div><div class="px num">'+n2(r.price)+'</div></div>'+
        '<div class="mid"><span class="st bg-'+r.status+'">'+STATUS_TXT[r.status]+'</span>'+
          '<div class="why">'+r.why+'</div>'+
          '<div class="meta"><span>מבנה <b>'+r.structure+'</b></span>'+
          '<span>איכות <b>'+(r.quality||'—')+'</b></span>'+
          '<span>'+(r.family||'אין סטאפ')+'</span>'+
          '<span>נפח <b class="num">'+(r.volx?r.volx.toFixed(1)+'×':'—')+'</b></span>'+
          (r.age!=null?'<span>גיל <b>'+r.age+'</b></span>':'')+'</div>'+
          (qs('#cmpOn').checked&&r.prod?'<div class="fl">Production: <b>'+(r.prod.status||'—')+'</b> · V2: <b>'+STATUS_TXT[r.status]+'</b></div>':'')+
          extra+
        '</div>'+
        '<div class="rt"><div class="score">'+r.score+'<small>/10</small></div>'+spark(r)+'</div></div>';
    }).join('');
    [].forEach.call(document.querySelectorAll('.takeBtn'),function(b){
      b.onclick=function(e){e.stopPropagation();var s=b.dataset.s,d=store[s];
        positions[s]={setupId:d.setupId,entry:d.plan.entry,stop:d.plan.stop,t1:d.plan.t1,t2:d.plan.t2,at:d.time};
        d.pos=positions[s];d.status='ACTIVE';toast('ACTIVE · '+s);render();};});
    [].forEach.call(document.querySelectorAll('.closeBtn'),function(b){
      b.onclick=function(e){e.stopPropagation();var s=b.dataset.s;
        if(positions[s])consumed[positions[s].setupId]=true;delete positions[s];
        if(store[s]){store[s].pos=null;store[s].status='AVOID';store[s].why='הסטאפ כבר מוצה — אין כניסה חוזרת';}
        toast('נסגר · '+s);render();};});
    [].forEach.call(document.querySelectorAll('.row'),function(el){
      el.onclick=function(){location.href='/trader-v2/live?symbol='+el.dataset.s};
      el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();location.href='/trader-v2/live?symbol='+el.dataset.s}};});
  }

  function logRow(d){
    var sig=[d.status,d.setupId,d.plan?d.plan.entry+'/'+d.plan.stop:''].join('|');
    var changed=sig!==lastSig[d.symbol], prev=lastSig[d.symbol]||''; lastSig[d.symbol]=sig;
    var row=Object.freeze({seq:decisions.length+1,logged_at:new Date().toISOString(),symbol:d.symbol,
      bar_time:d.time,price:d.price,decision:STATUS_TXT[d.status],status:d.status,engine_state:d.engineState,
      family:d.family,setup_id:d.setupId,age:d.age,score:d.score,quality:d.quality,
      entry:d.plan?d.plan.entry:'',stop:d.plan?d.plan.stop:'',t1:d.plan?d.plan.t1:'',t2:d.plan?d.plan.t2:'',
      rr:d.plan?d.plan.rr:'',chase_atr:d.ext==null?'':+d.ext.toFixed(2),
      waiting_for:d.waiting.join(' | '),is_transition:changed,prev_signature:prev});
    decisions.push(row); if(changed)transitions.push(row);
    return changed?row:null;
  }
  function alertIf(row,d){
    if(!row||!alertsOn)return;
    var show=null;
    if(d.status==='READY'&&d.plan)show={t:'BUY NOW · '+d.symbol+' '+d.time,
      b:'ENTRY $'+n2(d.plan.entry)+' · STOP $'+n2(d.plan.stop)+' · T1 $'+n2(d.plan.t1)+
        '<br>סיכון $'+n2(d.price-d.plan.stop)+' למניה · R:R בפועל '+n2((d.plan.t1-d.price)/(d.price-d.plan.stop))};
    else if(d.status==='CLOSE')show={t:'קרוב מאוד · '+d.symbol+' '+d.time,b:d.why};
    else if(/בוטל/.test(d.why))show={t:'הסטאפ בוטל · '+d.symbol+' '+d.time,b:d.why};
    if(!show)return;
    qs('#alertTitle').textContent=show.t;qs('#alertBody').innerHTML=show.b;qs('#alertBox').hidden=false;
    if(navigator.vibrate)try{navigator.vibrate(180)}catch(e){}
  }
  on('#alertOk','click',function(){qs('#alertBox').hidden=true});
  on('#alertsBtn','click',function(){alertsOn=!alertsOn;toast(alertsOn?'התראות פועלות':'התראות כבויות')});

  function pull(){
    var date=today(),i=0,done=0;
    var step=function(){
      if(i>=symbols.length){qs('#prog').textContent='';render();return}
      var sym=symbols[i++];
      j('/day/'+sym+'/'+date+'?format=json').then(function(dd){
        var all=(dd.rows||[]).slice().sort(function(a,b){return a.unix-b.unix});
        var closed=(dd.market_open!==false&&all.length)?all.slice(0,-1):all;   // closed candles only
        if(closed.length>=16){var d=evaluate(sym,closed);
          if(d){d.prod=store[sym]&&store[sym].prod;store[sym]=d;var row=logRow(d);alertIf(row,d);}}
        done++;qs('#prog').textContent=done+'/'+symbols.length;
        if(done%8===0)render();
        setTimeout(step,120);
      },function(){done++;setTimeout(step,120)});
    };
    step();
    if(qs('#cmpOn').checked)j('/board?date='+date).then(function(b){
      (b.results||b.rows||[]).forEach(function(r){if(store[r.symbol])store[r.symbol].prod=r});
    },function(){});
  }

  function start(){
    j('/bars/index').then(function(d){
      symbols=((d.tracked&&d.tracked.length?d.tracked:d.symbols)||[]).slice(0,40);
      if(!symbols.length){toast('אין סימבולים');return}
      pull();
      var sec=+qs('#every').value; if(timer)clearInterval(timer);
      if(sec)timer=setInterval(pull,sec*1000);
    },function(e){toast('טעינת סימבולים נכשלה: '+e.message)});
  }
  on('#reload','click',pull);
  on('#sort','change',render); on('#cmpOn','change',render);
  on('#every','change',function(){var s=+qs('#every').value;if(timer)clearInterval(timer);
    if(s&&symbols.length)timer=setInterval(pull,s*1000);});
  setInterval(function(){qs('#clock').textContent=new Date().toLocaleTimeString('he-IL',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'})+' NY';},1000);
  start();
})();

</script>
</body>
</html>
