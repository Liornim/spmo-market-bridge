<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F4F7; --ink:#1B2430; --muted:#5B6673; --rule:#D6DBE2; --well:#FFFFFF;
    --up:#0F766E; --down:#B42318; --flat:#8A94A0;
    --s-quiet:#8A94A0; --s-watch:#B7791F; --s-close:#C2410C; --s-ready:#0F766E; --s-active:#1D4ED8; --s-avoid:#B42318; --s-none:#98A2B3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .num{direction:ltr;unicode-bidi:isolate}
  button,select{font:inherit}
  button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
  .hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
  .hrow h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.01em}
  .spacer{flex:1}
  .mini-btn{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink)}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;font-size:12.5px;color:var(--muted);scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip b{color:var(--ink);font-weight:600}
  .strip .chip{background:var(--well);border:1px solid var(--rule);border-radius:8px;padding:4px 9px;white-space:nowrap}
  .strip .chip.up b{color:var(--up)} .strip .chip.down b{color:var(--down)}
  .counts{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .counts::-webkit-scrollbar{display:none}
  .cnt{border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;border:none}
  .cnt[data-on="0"]{opacity:.35}
  .cnt.sel{outline:2px solid var(--ink);outline-offset:1px}
  .ctrl{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-size:13px;color:var(--muted)}
  .ctrl select{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:6px 9px;font-size:13px;color:var(--ink)}

  .rows{padding:6px 10px 0}
  .row{display:grid;grid-template-columns:60px 1fr 74px;gap:8px 10px;background:var(--well);border:1px solid var(--rule);border-left:4px solid var(--s-none);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;align-items:center}
  .row:active{transform:scale(.995)}
  .row .sym{font-weight:800;font-size:16px;letter-spacing:.02em}
  .row .px{font-size:13px;color:var(--muted);font-weight:600}
  .row .mid{min-width:0}
  .row .st{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.03em}
  .row .why{font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .row .meta b{color:var(--ink);font-weight:600}
  .row .rt{text-align:left}
  .row .score{font-size:20px;font-weight:800;line-height:1}
  .row .score small{font-size:11px;font-weight:600;color:var(--muted)}
  .row svg{display:block;width:74px;height:26px;margin-top:4px}
  .row.stale{opacity:.6}
  .QUIET{border-left-color:var(--s-quiet)} .WATCH{border-left-color:var(--s-watch)} .CLOSE{border-left-color:var(--s-close)}
  .READY{border-left-color:var(--s-ready)} .ACTIVE{border-left-color:var(--s-active)} .AVOID{border-left-color:var(--s-avoid)}
  .bg-QUIET{background:var(--s-quiet)} .bg-WATCH{background:var(--s-watch)} .bg-CLOSE{background:var(--s-close)}
  .bg-READY{background:var(--s-ready)} .bg-ACTIVE{background:var(--s-active)} .bg-AVOID{background:var(--s-avoid)} .bg-NODATA{background:var(--s-none)}
  .spark .line{fill:none;stroke:var(--ink);stroke-width:1.2}
  .spark .lvl{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 2}
  .spark .sup{stroke:var(--up)} .spark .res{stroke:var(--down)}
  .spark .dot{fill:var(--ink)}

  .sheet{position:fixed;inset:0;z-index:40;background:rgba(20,26,34,.45);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .panel{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .grab{width:38px;height:4px;background:var(--rule);border-radius:2px;margin:8px auto 0}
  .phead{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
  .phead .s{font-size:22px;font-weight:800} .phead .p{font-size:22px;font-weight:800}
  .phead .chg{font-size:14px;font-weight:600}
  .phead .chg.up{color:var(--up)} .phead .chg.down{color:var(--down)}
  .pstat{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap}
  .pstat .st{font-size:13px;font-weight:800;color:#fff;border-radius:7px;padding:4px 10px}
  .pstat .sc{font-size:13px;color:var(--muted)} .pstat .sc b{font-size:18px;color:var(--ink)}
  .pstat .fr{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .pstat .fr i{width:8px;height:8px;border-radius:50%;background:var(--flat)}
  .fr.LIVE i{background:var(--up)} .fr.DELAYED i{background:var(--s-watch)} .fr.STALE i{background:var(--down)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
  .card{background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:9px 11px}
  .card small{display:block;font-size:11.5px;color:var(--muted)} .card b{font-size:17px;font-weight:800}
  .card span{font-size:11.5px;color:var(--muted)}
  .lvls{padding:12px 16px 0}
  .lvls .l{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
  .lvls .l span:first-child{color:var(--muted);font-size:12px} .lvls .l b{font-weight:700} .lvls .l i{font-style:normal;font-size:11.5px;color:var(--muted)}
  .bar{margin:14px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:14px 12px 10px}
  .bar svg{display:block;width:100%;height:56px}
  .bar .t{fill:var(--muted);font-size:9.5px} .bar .now{fill:var(--ink);font-size:10.5px;font-weight:700}
  .sec{padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
  .sec b{color:var(--ink);font-weight:600}
  .acts{display:flex;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
  .acts button{background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600}
  .acts .ghost{background:var(--well);color:var(--ink);border:1px solid var(--rule)}
  .menu{margin:8px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .menu[hidden]{display:none}
  .menu button{display:block;width:100%;text-align:right;background:none;border:none;border-bottom:1px solid var(--rule);padding:11px 14px;font-size:14px;color:var(--ink)}
  .menu button:last-child{border-bottom:none}
  .menu button small{color:var(--muted);font-size:12px;margin-right:6px}
  .feed{margin-top:14px;border-top:1px solid var(--rule)}
  .fmodes{display:flex;gap:6px;padding:10px 16px}
  .fmodes button{background:var(--well);border:1px solid var(--rule);border-radius:9px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
  .fmodes button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ev{display:grid;grid-template-columns:48px 1fr auto;gap:8px;padding:9px 16px;border-bottom:1px solid var(--rule);font-size:13.5px;align-items:baseline;border-right:3px solid transparent}
  .ev .t{color:var(--muted);font-size:12.5px}
  .ev.g{border-right-color:var(--up)} .ev.r{border-right-color:var(--down)} .ev.o{border-right-color:var(--s-close)}
  .ev.y{border-right-color:var(--s-watch)} .ev.b{border-right-color:var(--s-active)} .ev.n{border-right-color:var(--rule)}
  .empty{padding:22px 16px;text-align:center;color:var(--muted);line-height:1.6}
  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60}
  .toast[hidden]{display:none}

  .plan{margin:12px 16px 0;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px}
  .plan .act{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .plan .act b{font-size:26px;font-weight:800}
  .plan .act .st2{font-size:12px;font-weight:700;opacity:.75;letter-spacing:.04em}
  .plan .hl{font-size:13px;opacity:.8;margin-top:2px}
  .plan .wait{margin-top:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
  .plan .wait small{display:block;font-size:11.5px;opacity:.75} .plan .wait b{font-size:22px;font-weight:800}
  .plan .steps{margin-top:10px;display:grid;gap:5px;font-size:13px}
  .plan .steps div{display:grid;grid-template-columns:76px 1fr;gap:8px}
  .plan .steps span{opacity:.7;font-size:12px}
  .plan.FAILED .act b,.plan.DO_NOT_CHASE .act b{color:#FCA5A5}
  .plan.READY_PARTIAL .act b,.plan.READY_ADD .act b{color:#5EEAD4}
  .plan.ACTIVE .act b,.plan.TAKE_PROFIT_AREA .act b{color:#93C5FD}
  /* Alerts sit in a narrow column at the side and never span the screen, so
     they cannot cover the rows or the decision block underneath. */
  .alerts{position:fixed;top:auto;bottom:12px;right:8px;left:auto;z-index:70;display:flex;flex-direction:column;
    gap:6px;pointer-events:none;width:min(260px,62vw);max-height:46vh;overflow:hidden}
  .al{background:var(--well);border:1px solid var(--rule);border-right:5px solid var(--s-active);border-radius:11px;
    padding:7px 10px;box-shadow:0 4px 14px rgba(20,26,34,.14);pointer-events:auto;font-size:12.5px;opacity:.97}
  .al.high{border-right-color:var(--s-ready)} .al.bad{border-right-color:var(--s-avoid)} .al.med{border-right-color:var(--s-close)}
  .al b{font-size:13.5px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .al div{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .al .x{position:absolute;inset-inline-start:6px;top:5px;color:var(--muted);font-size:14px;line-height:1;padding:2px 5px}
  .al{position:relative;padding-inline-start:26px}
  .log2{margin:0 16px;background:var(--well);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .log2[hidden]{display:none}
  .log2 button{display:block;width:100%;text-align:right;background:none;border:none;border-bottom:1px solid var(--rule);padding:9px 12px;font-size:13px;color:var(--ink)}
  .log2 button:last-child{border-bottom:none}
  .log2 small{color:var(--muted);margin-left:6px}
  .range{margin:8px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:12px;padding:12px}
  .range[hidden]{display:none}
  .range label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
  .range .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .range select{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:8px;font-size:13px}
  .range .sum{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5}
  .range .go{margin-top:9px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
  .sess{background:var(--s-avoid);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:5px}
  .sess[hidden]{display:none}

  .wn{margin:12px 16px 0;background:var(--well);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
  .wn .top2{padding:14px;background:var(--ink);color:var(--paper)}
  .wn .top2 .a{font-size:27px;font-weight:800;line-height:1.15}
  .wn .top2 .n{font-size:14px;margin-top:6px;opacity:.9;line-height:1.5}
  .wn .scen{font-size:11.5px;opacity:.75;margin-top:6px;letter-spacing:.02em}
  .wn.WATCH_ONLY .top2 .a{color:#CBD5E1}
  .wn.ENTRY_AVAILABLE .top2 .a{color:#5EEAD4} .wn.SETUP_CANCELLED .top2 .a,.wn.EXIT .top2 .a{color:#FCA5A5}
  .wn.TAKE_PARTIAL .top2 .a,.wn.HOLD .top2 .a{color:#93C5FD} .wn.SESSION_CLOSED .top2 .a{color:#FDE68A}
  .odds{padding:12px 14px 0}
  .odds .bar2{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
  .odds .u{background:var(--up);display:flex;align-items:center;justify-content:center}
  .odds .d{background:var(--down);display:flex;align-items:center;justify-content:center}
  .odds .q{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .odds .q b{color:var(--ink)}
  .paths{padding:12px 14px 4px;display:grid;gap:10px}
  .pth{border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.65}
  .pth.u{background:#E6F4F1} .pth.d{background:#FBEAE7}
  .pth h4{margin:0 0 4px;font-size:12.5px;font-weight:800;color:var(--muted)}
  .pth div{margin-top:2px}
  .wn .why2{padding:10px 14px 14px;font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--rule)}
  details.raw{margin:12px 16px 0}
  details.raw>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 0}

  .flow{padding:12px 14px 0}
  .flow .fb{display:flex;height:22px;border-radius:7px;overflow:hidden;font-size:11.5px;font-weight:700;color:#fff}
  .flow .fb .b{background:var(--up);display:flex;align-items:center;justify-content:center}
  .flow .fb .s{background:var(--down);display:flex;align-items:center;justify-content:center}
  .flow .ft{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .flow .ft b{color:var(--ink)}
  .book{padding:10px 14px 0}
  .book .bb{display:flex;height:20px;border-radius:7px;overflow:hidden;font-size:11px;font-weight:700;color:#fff}
  .book .bb .b{background:var(--up);display:flex;align-items:center;justify-content:center}
  .book .bb .a{background:var(--down);display:flex;align-items:center;justify-content:center}
  .book .lv3{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 10px;margin-top:8px;font-size:12px;direction:ltr}
  .book .lv3 .h{color:var(--muted);font-size:11px;font-weight:600}
  .book .lv3 .bq{text-align:right;color:var(--up)} .book .lv3 .aq{text-align:left;color:var(--down)}
  .book .lv3 .px2{text-align:center;font-weight:600}
  .book .meta2{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.55}
  .book .warn{font-size:11px;color:var(--muted);opacity:.9;margin-top:4px}
  .flow .src{font-size:11px;color:var(--muted);opacity:.85;margin-top:4px}
  .row .fl{font-size:11px;margin-top:2px}
  .row .fl b{font-weight:700}
  .row .fl .up{color:var(--up)} .row .fl .dn{color:var(--down)}
  @media(min-width:720px){
    .alerts{width:300px;bottom:16px;right:16px}
    .row{grid-template-columns:80px 1fr 120px 90px}
    .rows{max-width:900px;margin:0 auto}
    .panel{max-width:720px;margin:0 auto;border-radius:18px;max-height:88vh}
    .sheet{align-items:center}
  }
</style>
</head>
<body>
<header>
  <div class="sess" id="sess" hidden>הסשן הסתיים — התצוגה היא מצב בסגירה, לא איתות חי</div>
  <div class="hrow">
    <h1>Market Radar</h1>
    <div class="spacer"></div>
    <span id="clock" style="font-size:12px;color:var(--muted)"></span>
    <button class="mini-btn" id="reload" type="button">רענן</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="counts" id="counts"></div>
  <div class="ctrl">
    <span>מיון</span>
    <select id="sort">
      <option value="attention" selected>תשומת לב</option>
      <option value="score">ציון Setup</option>
      <option value="distance">מרחק לרמה</option>
      <option value="volume">נפח</option>
      <option value="symbol">סימבול</option>
    </select>
    <select id="sens">
      <option value="sensitive">רגיש</option>
      <option value="balanced" selected>מאוזן</option>
      <option value="quiet">שקט</option>
    </select>
    <div class="spacer"></div>
    <select id="every" aria-label="רענון אוטומטי">
      <option value="0">רענון: כבוי</option>
      <option value="10">10 שנ׳</option>
      <option value="15">15 שנ׳</option>
      <option value="30" selected>30 שנ׳</option>
      <option value="60">60 שנ׳</option>
    </select>
    <button class="mini-btn" id="alertsBtn" type="button">🔔</button>
    <span id="prog"></span>
  </div>
  <div class="log2" id="alertLog" hidden></div>
</header>

<div class="rows" id="rows"><div class="empty">טוען…</div></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel"><div class="grab"></div></div>
</div>
<div class="alerts" id="alerts"></div>
<div class="toast" id="toast" hidden></div>

<!--ENGINE-->
<script>
(function(){
  var qs=function(s){return document.querySelector(s)};
  var MARKET=['SPY','QQQ'];
  var SECTOR={NVDA:'SMH',AVGO:'SMH',AMD:'SMH',MU:'SMH',AAPL:'XLK',MSFT:'XLK',GOOGL:'XLC',META:'XLC',AMZN:'XLY',TSLA:'XLY',JPM:'XLF','BRK-B':'XLF'};
  var SENS={sensitive:{K:3,minMove:1.0,runs:2},balanced:{K:3,minMove:1.5,runs:3},quiet:{K:3,minMove:2.0,runs:3}};
  var STATUS_TXT={QUIET:'שקט',WATCH:'מעקב',CLOSE:'קרוב',READY:'מוכן',ACTIVE:'פעיל',AVOID:'להימנע','NO DATA':'אין נתונים'};
  var MOM_TXT={PUSHING:'דוחף',PULLBACK:'נסיגה',RECOVERY:'התאוששות',SELLING:'מכירות',FLAT:'שטוח'};
  var STRUCT_TXT={UP:'עולה',DOWN:'יורד',RANGE:'טווח'};
  // The row leads with the plain action so the list answers "what do I do"
  // without opening anything.
  var PLAIN={NO_SETUP:'לא לקנות · ',WAITING_FOR_ZONE:'לעקוב · ',IN_ZONE:'לחכות לאישור · ',READY_PARTIAL:'אפשר להיכנס · ',
    WAITING_FOR_CONFIRMATION:'לחכות לאישור · ',READY_ADD:'אפשר להוסיף · ',ACTIVE:'להחזיק · ',
    TAKE_PROFIT_AREA:'לממש חלק · ',DO_NOT_CHASE:'לא לרדוף · ',FAILED:'בוטל · '};

  // store: symbol -> { rows (raw candles by date), analysis, row, days }
  var store={}, symbols=[], marketA={}, filterStatus=null, openSym=null, feedMode='IMPORTANT', menuOpen=false;
  var alertState={}, alertLog=[], alertsOn=true, soundOn=false, loading=false, tick=0, rangeOpen=false, sessionEnded=false;
  var opts=function(){return SENS[qs('#sens').value]||SENS.balanced};

  function bust(u){return u+(u.indexOf('?')>0?'&':'?')+'ts='+Date.now()}
  function j(u){return fetch(bust(u),{cache:'no-store'}).then(function(r){if(!r.ok&&r.status!==404)throw new Error(r.status);return r.json()})}
  function fmtK(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':String(v)}
  function toast(t){var el=qs('#toast');el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(function(){el.hidden=true},1800)}

  function freshness(d){
    if(!d||!d.rows||!d.rows.length)return 'NO DATA';
    var last=d.rows[d.rows.length-1];
    if(last.time>='15:59')return 'SESSION ENDED';
    var s=d.stale_seconds;
    if(s==null)return 'STALE';
    return s<=180?'LIVE':s<=600?'DELAYED':'STALE';
  }

  // ---- loading. One request per symbol; market ETFs fetched once and reused.
  function loadSymbol(sym){
    return j('/day/'+sym+'?format=json').then(function(d){
      var st=store[sym]||(store[sym]={days:{}});
      st.date=d.date; st.stale=d.stale_seconds; st.fresh=freshness(d);
      st.days[d.date]=d.rows||[];
      st.rows=d.rows||[];
      st.A=st.rows.length?analyze(st.rows,opts()):null;
      return st;
    },function(){var st=store[sym]||(store[sym]={days:{}});st.fresh='NO DATA';st.A=null;return st});
  }
  function mkLabel(sym){return marketCtxFor(sym).label}
  function marketCtxFor(sym){
    var list=MARKET.concat(SECTOR[sym]?[SECTOR[sym]]:[]);
    return marketContext(list.map(function(s){return marketA[s]||null}));
  }
  // One place builds the snapshot, so every caller gets the same object.
  function buildSnap(s,now){
    var st=store[s]; if(!st)return null;
    st.snap=buildTickerState(s,st.A,{market:mkLabel(s),marketCtx:marketCtxFor(s),freshness:st.fresh,
      daily:st.daily,baseline:st.baseline,calibration:st.calibration,
      sessionEnded:sessionEnded||st.fresh==='SESSION ENDED',now:now||Date.now(),date:st.date});
    // The row is part of the snapshot, never a separate calculation.
    st.row=st.snap.row||{symbol:s,status:st.snap.status,why:'אין נתונים',score:0,price:null,
      structure:'RANGE',momentum:'FLAT',nearestR:Infinity,freshness:st.fresh||'NO DATA',urgency:9};
    st.row.state=st.snap; st.row.status=st.snap.status; st.row.score=st.snap.score||0;
    if(!st.snap.valid&&st.snap.violations&&st.snap.violations[0]&&st.snap.violations[0].code!=='NO_DATA'){
      st.row.why='מצב המודל לא עקבי'; st.row.status='AVOID';
    }
    return st.snap;
  }
  function recompute(){
    sessionEnded=symbols.length>0&&symbols.every(function(s){return !store[s]||store[s].fresh==='SESSION ENDED'||store[s].fresh==='NO DATA'});
    qs('#sess').hidden=!sessionEnded;
    var now=Date.now();
    symbols.forEach(function(s){
      var st=store[s]; if(!st)return;
      if(st.rows&&st.rows.length)st.A=analyze(st.rows,opts());
      // One snapshot per symbol per refresh. The row and the detail sheet both
      // read this object, so a score can never differ between them.
      buildSnap(s,now);
    });
    render();
  }

  function refresh(){ return loadAll().then(function(){ if(openSym&&!sessionEnded)loadBook(openSym); if(openSym)drawDetail(); }); }
  function loadAll(){
    if(loading)return Promise.resolve();       // never overlap two refreshes
    loading=true;
    qs('#prog').textContent='טוען…';
    return j('/').then(function(h){
      symbols=(h.tracked||[]).filter(function(s){return MARKET.indexOf(s)<0});
      var mkt=MARKET.concat(['SMH','XLK','XLC','XLY','XLF'].filter(function(e){return symbols.some(function(s){return SECTOR[s]===e})}));
      return Promise.all(mkt.map(function(s){
        return j('/day/'+s+'?format=json').then(function(d){marketA[s]=(d.rows||[]).length?analyze(d.rows,opts()):null;if(marketA[s])marketA[s].symbol=s;
          store[s]=store[s]||{days:{}};store[s].rows=d.rows||[];store[s].date=d.date;store[s].stale=d.stale_seconds;store[s].fresh=freshness(d);store[s].days[d.date]=d.rows||[];},
          function(){marketA[s]=null});
      }));
    }).then(function(){
      var done=0;
      return Promise.all(symbols.map(function(s){
        return loadSymbol(s).then(function(){done++;qs('#prog').textContent=done+'/'+symbols.length;});
      }));
    }).then(function(){qs('#prog').textContent='';loading=false;recompute();fireAlerts()},
      function(e){loading=false;throw e});

  // ---- sparkline: last 45 bars + tactical levels
  function spark(st,row){
    var bars=(st.A?st.A.bars:[]).slice(-45); if(bars.length<2)return '';
    var W=74,H=26,lo=Infinity,hi=-Infinity;
    bars.forEach(function(b){lo=Math.min(lo,b.low);hi=Math.max(hi,b.high)});
    var lv=[row&&row.support?row.support.price:null,row&&row.resistance?row.resistance.price:null];
    lv.forEach(function(p){if(p!=null){lo=Math.min(lo,p);hi=Math.max(hi,p)}});
    var sp=(hi-lo)||1, y=function(v){return 2+(hi-v)/sp*(H-4)}, x=function(i){return i/(bars.length-1)*(W-3)+1.5};
    var d=bars.map(function(b,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(b.close).toFixed(1)}).join(' ');
    var out='<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
    if(lv[0]!=null)out+='<line class="lvl sup" x1="0" x2="'+W+'" y1="'+y(lv[0]).toFixed(1)+'" y2="'+y(lv[0]).toFixed(1)+'"/>';
    if(lv[1]!=null)out+='<line class="lvl res" x1="0" x2="'+W+'" y1="'+y(lv[1]).toFixed(1)+'" y2="'+y(lv[1]).toFixed(1)+'"/>';
    out+='<path class="line" d="'+d+'"/><circle class="dot" cx="'+x(bars.length-1).toFixed(1)+'" cy="'+y(bars[bars.length-1].close).toFixed(1)+'" r="1.8"/></svg>';
    return out;
  }

  // Multi-day layer: the five most recent sessions, fetched once per symbol
  // when its detail is first opened. Auto-refresh never re-fetches them.
  function loadHistory(sym){
    var st=store[sym]; if(!st||st.histLoading||st.hist)return Promise.resolve();

  function rangeBar(b,T){

    var W=100,x=6+pos*(W-12);
    return '<div class="bar"><svg viewBox="0 0 100 26" preserveAspectRatio="none">'+
      '<line x1="6" x2="94" y1="14" y2="14" stroke="var(--rule)" stroke-width="1.5"/>'+

  function feed(A){
    var states=A.events.slice().reverse(), out=[];
    states.forEach(function(s){
      var lines=s.events.map(evLine).filter(Boolean);
      if(feedMode==='IMPORTANT')lines=lines.filter(function(l,i){return IMPORTANT[s.events[i]&&s.events[i].type]});
      if(!lines.length)return;                       // never render a bare score row
      out.push({time:s.time,close:s.close,lines:lines});
    });
    if(feedMode==='LIVE')out=out.slice(0,8);
    if(!out.length)return '<div class="empty">אין אירועים להצגה במצב הזה.</div>';
    return out.map(function(o){
      return '<div class="ev '+o.lines[0].cls+'"><span class="t">'+o.time+'</span><span>'+o.lines.map(function(l){return l.text}).join(' · ')+'</span><span class="num">'+o.close.toFixed(2)+'</span></div>';

  // ---- copy
  var CSV='symbol,date,time,open,high,low,close,volume,dir,body_pct,upper_wick_pct,lower_wick_pct,range,vol_x';
  function csvRows(sym,rows){
    // vol_x is normalised over the day the candles belong to, so a partial copy
    // reports the same value the full day would.
    var byDate={}; rows.forEach(function(r){(byDate[r.date]=byDate[r.date]||[]).push(r)});
    var avg={}; Object.keys(byDate).forEach(function(d){var a=(store[sym].days[d]||byDate[d]);avg[d]=a.reduce(function(s,x){return s+x.volume},0)/a.length});
    return rows.map(function(r){
      var range=r.high-r.low, pct=function(x){return range>0?Math.round(x/range*1000)/10:0};
      var dir=r.close>r.open?'BULL':r.close<r.open?'BEAR':'FLAT';
      return [sym,r.date,r.time,r.open,r.high,r.low,r.close,r.volume,dir,
        pct(Math.abs(r.close-r.open)),pct(r.high-Math.max(r.open,r.close)),pct(Math.min(r.open,r.close)-r.low),
        Math.round(range*10000)/10000,avg[r.date]>0?Math.round(r.volume/avg[r.date]*100)/100:0].join(',');
    });
  }

  // Fetches every trading day in the range that is not already in memory.
  // Days with no data (weekends, holidays) simply do not exist in /days and
  // are skipped — nothing is fabricated.
  function fetchRange(sym,from,to){
    var st=store[sym];
    var days=(st.dates||[]).filter(function(d){return d>=from&&d<=to}).sort();
    var missing=days.filter(function(d){return !st.days[d]});
    qs('#rSum').textContent='טוען '+missing.length+' ימים…';
    return Promise.all(missing.map(function(d){
      return j('/day/'+sym+'/'+d+'?format=json').then(function(x){st.days[d]=x.rows||[]},function(){st.days[d]=null});
    })).then(function(){
      var ok=days.filter(function(d){return st.days[d]&&st.days[d].length});
      var failed=days.filter(function(d){return !st.days[d]||!st.days[d].length});
      return {days:ok,failed:failed,count:ok.reduce(function(a,d){return a+st.days[d].length},0)};
    });
  }

      'MARKET: '+mk.label+(mk.parts.length?' ('+mk.parts.map(function(p){return p.symbol+(p.aboveVwap?'>':'<')+'VWAP '+p.align}).join(', ')+')':''),
      'SWINGS (last 8): '+(sw.length?sw.map(function(w){return w.label+' '+w.price.toFixed(2)+'@'+w.time}).join(', '):'none'),
      'RECENT EVENTS: '+(function(){var out=[];A.events.slice().reverse().forEach(function(s){if(out.length>=6)return;
        var l=s.events.map(evLine).filter(function(x,i){return x&&IMPORTANT[s.events[i].type]});
        if(l.length)out.push(s.time+' '+l.map(function(x){return x.text}).join(' · '))});return out.length?out.join(' | '):'none'})(),
      'Source: '+location.origin+'/day/'+openSym+'/'+vd+'?ts='+Date.now()

  function copyPayload(kind){
    var st=store[openSym], vd=st.viewDate||st.date, today=st.days[vd]||st.rows||[];
    var head=function(rows){return [CSV].concat(csvRows(openSym,rows)).join('\n')};

    if(kind==='state20')return stateText()+'\n\n'+head(today.slice(-20));
    if(kind==='state50')return stateText()+'\n\n'+head(today.slice(-50));
    if(kind==='stateall')return stateText()+'\n\n'+head(today);

  // ---- alerts. Identity = symbol + execution state + the level it refers to,
  // so the same condition never fires twice while it persists.
  var PRIORITY={READY_PARTIAL:'high',READY_ADD:'high',FAILED:'bad',TAKE_PROFIT_AREA:'med',DO_NOT_CHASE:'med',ACTIVE:'med'};
  var ALERT_TXT={
    READY_PARTIAL:function(r){return['כניסה חלקית',r.plan.waitPrice+' · האזור מוחזק']},
    READY_ADD:function(r){return['אישור להוספה','חזר מעל '+r.plan.addAbove.toFixed(2)]},
    FAILED:function(r){return['setup בוטל',(r.plan.invalidation!=null?r.plan.invalidation.toFixed(2)+' נשבר':'הרמה נשברה')]},
    TAKE_PROFIT_AREA:function(r){return['מתקרב ליעד',r.plan.target?r.plan.target.toFixed(2):'']},
    DO_NOT_CHASE:function(r){return['המחיר התרחק מהכניסה','המתן לפולבק '+r.plan.waitPrice]},
    ACTIVE:function(r){return['מהלך פעיל',r.plan.target?'יעד '+r.plan.target.toFixed(2):'']}
  };
  function alertKey(r){
    var P=r.plan; if(!P)return null;
    var lvl=P.kind==='pullback'?(P.entry||0):(P.zone?P.zone[0]:0);
    return r.symbol+'|'+P.state+'|'+lvl.toFixed(2);
  }
  function fireAlerts(){
    if(sessionEnded)return;                       // no live alerts after the close
    symbols.forEach(function(s){
      var r=store[s]&&store[s].row; if(!r||!r.plan)return;
      if(r.freshness==='STALE'||r.freshness==='NO DATA'||r.freshness==='SESSION ENDED')return;
      var txt=ALERT_TXT[r.plan.state]; if(!txt)return;
      var key=alertKey(r);
      if(alertState[s]===key)return;              // same condition, already announced
      alertState[s]=key;
      var body=txt(r), pri=PRIORITY[r.plan.state]||'med';
      alertLog.unshift({time:new Date().toTimeString().slice(0,5),symbol:s,title:body[0],sub:body[1],pri:pri});
      alertLog=alertLog.slice(0,20);
      if(alertsOn)showAlert(s,body[0],body[1],pri);
      if(soundOn&&pri==='high')beep();
      drawAlertLog();
    });
  }
  function showAlert(sym,title,sub,pri){
    var host=qs('#alerts'), el=document.createElement('div');
    el.className='al '+pri;
    el.innerHTML='<span class="x">×</span><b>'+sym+' — '+title+'</b><div>'+(sub||'')+'</div>';
    el.onclick=function(ev){ if(ev&&ev.target&&ev.target.className==='x'){el.remove();return} openDetail(sym); el.remove(); };
    host.appendChild(el);
    setTimeout(function(){el.remove()},9000);
    // At most two on screen at once; the rest stay in the log behind the bell.
    while(host.children.length>2)host.removeChild(host.firstChild);
  }
  function beep(){ try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.05;o.start();setTimeout(function(){o.stop();c.close()},140)}catch(e){} }
  function drawAlertLog(){
    var el=qs('#alertLog');
    el.innerHTML='<button type="button" data-x="1" style="font-weight:600">התראות '+
      '<small>פופאפ '+(alertsOn?'פעיל':'כבוי')+' · צליל '+(soundOn?'פעיל':'כבוי')+'</small></button>'+
      (alertLog.length?alertLog.map(function(a,i){return '<button type="button" data-i="'+i+'">'+a.time+' · <b>'+a.symbol+'</b> '+a.title+' <small>'+(a.sub||'')+'</small></button>'}).join('')
        :'<button type="button" disabled>עוד לא היו התראות</button>');

  function bindRange(){

    var upd=function(){
      var f=qs('#rFrom').value,t2=qs('#rTo').value;
      if(f>t2){qs('#rSum').textContent='טווח לא תקין';return}
      var st=store[openSym];
      var days=(st.dates||[]).filter(function(d){return d>=f&&d<=t2});
      var known=days.filter(function(d){return st.days[d]});
      var cnt=known.reduce(function(a,d){return a+(st.days[d]?st.days[d].length:0)},0);
      qs('#rSum').textContent=f+' → '+t2+' · '+days.length+' ימי מסחר'+(known.length<days.length?' ('+(days.length-known.length)+' ייטענו בהעתקה)':' · '+cnt.toLocaleString()+' נרות');
    };
    qs('#rFrom').onchange=upd; qs('#rTo').onchange=upd; upd();
    qs('#rGo').onclick=function(){
      var f=qs('#rFrom').value,t2=qs('#rTo').value;
      if(f>t2){toast('טווח לא תקין');return}
      fetchRange(openSym,f,t2).then(function(res){
        if(!res.days.length){qs('#rSum').textContent='אין נתונים בטווח הזה';return}
        var txt=res.days.map(function(d){return '===== '+d+' =====\n'+[CSV].concat(csvRows(openSym,store[openSym].days[d])).join('\n')}).join('\n\n');
        var note=res.failed.length?' · '+res.failed.length+' ימים לא נטענו':'';
        qs('#rSum').textContent=f+' → '+t2+' · '+res.days.length+' ימים · '+res.count.toLocaleString()+' נרות'+note;
        if(res.count>200000)toast('ייצוא גדול — '+res.count.toLocaleString()+' נרות');
        doCopy(txt,res.count.toLocaleString()+' נרות מ-'+res.days.length+' ימים'+note);
      });
    };
  }

  qs('#sheet').onclick=function(e){if(e.target===qs('#sheet'))closeDetail()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openSym)closeDetail()});
  qs('#sort').onchange=render;
  qs('#sens').onchange=function(){recompute();if(openSym)drawDetail()};
  qs('#reload').onclick=function(){loadAll().then(function(){if(openSym)drawDetail();toast('עודכן')})};
  setInterval(function(){var d=new Date();qs('#clock').textContent=d.toTimeString().slice(0,5)},1000);

  // Auto-refresh: one timer for the whole page, never overlapping requests,
  // and it stops once the session is over.
  setInterval(function(){
    var every=parseInt(qs('#every').value,10)||0;
    if(!every||document.hidden||sessionEnded){qs('#prog').textContent=loading?'מרענן…':'';return}
    tick++;
    var left=every-(tick%every);
    qs('#prog').textContent=loading?'מרענן…':'עוד '+left+'ש';
    if(tick%every===0&&!loading)refresh();
  },1000);
  qs('#every').onchange=function(){tick=0};

  loadAll().catch(function(e){qs('#rows').innerHTML='<div class="empty"><b>שגיאת טעינה</b><br>'+String(e)+'</div>'});
})();
</script>
</body>
</html>
